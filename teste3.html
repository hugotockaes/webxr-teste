<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Teste WebXR - Menu</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>

    body {
      margin: 0;
      background: black;
      font-family: Arial, Helvetica, sans-serif;
    }

    #entrada {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: black;
      color: white;

      z-index: 20;
    }

    #entrada h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    #entrada p {
      color: #aaa;
      margin-bottom: 30px;
    }

    #entrar {
      padding: 16px 32px;

      border: none;
      border-radius: 10px;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      background: white;
      color: black;
    }

  </style>

</head>


<body>


<!-- TELA INICIAL -->

<div id="entrada">

  <h1>Experiência WebXR</h1>

  <p>
    Entre no ambiente para escolher uma imagem.
  </p>

  <button id="entrar">
    ENTRAR
  </button>

</div>



<!-- CENA WEBXR -->

<a-scene
  background="color: #000000"
  cursor="rayOrigin: mouse"
  raycaster="objects: .clicavel"
>


  <!-- PANORAMA -->

  <a-sky
    id="panorama"
    src="imagens/imagem360.jpg"
    visible="false"
    rotation="0 -90 0">
  </a-sky>



  <!-- MENU PRINCIPAL -->

  <a-entity
    id="menu"
    position="0 1.6 -2"
  >


    <!-- FUNDO -->

    <a-plane
      width="1.8"
      height="1.1"

      color="#111111"

      opacity="0.95"

      material="shader: flat">
    </a-plane>



    <!-- TÍTULO -->

    <a-text
      value="Escolha uma imagem"

      align="center"

      width="1.5"

      color="#FFFFFF"

      position="0 0.30 0.02">
    </a-text>



    <!-- BOTÃO IMAGEM 1 -->

    <a-plane
      id="imagem1"

      class="clicavel"

      width="1.25"
      height="0.32"

      position="0 -0.15 0.03"

      color="#FFFFFF"

      material="shader: flat"
    >


      <a-text
        value="IMAGEM 1"

        align="center"

        color="#000000"

        width="1.1"

        position="0 0 0.01">
      </a-text>


    </a-plane>


  </a-entity>



  <!-- BOTÃO MENU -->

  <a-entity
    id="botaoMenu"
    position="0 1.2 -1.5"
    visible="false"
  >


    <a-plane
      id="voltarMenu"

      class="clicavel"

      width="0.65"
      height="0.25"

      color="#111111"

      opacity="0.9"

      material="shader: flat"
    >


      <a-text
        value="MENU"

        align="center"

        color="#FFFFFF"

        width="0.6"

        position="0 0 0.01">
      </a-text>


    </a-plane>


  </a-entity>



  <!-- CÂMERA -->

  <a-entity
    id="rig"
    position="0 0 0"
  >

    <a-camera>


      <a-cursor
        fuse="false"
        raycaster="objects: .clicavel">
      </a-cursor>


    </a-camera>


  </a-entity>



  <!-- CONTROLE DIREITO -->

  <a-entity
    laser-controls="hand: right"
    raycaster="objects: .clicavel">
  </a-entity>



  <!-- CONTROLE ESQUERDO -->

  <a-entity
    laser-controls="hand: left"
    raycaster="objects: .clicavel">
  </a-entity>


</a-scene>



<script>


  const entrada =
    document.querySelector("#entrada");


  const botaoEntrar =
    document.querySelector("#entrar");


  const botaoImagem1 =
    document.querySelector("#imagem1");


  const panorama =
    document.querySelector("#panorama");


  const menu =
    document.querySelector("#menu");


  const botaoMenu =
    document.querySelector("#botaoMenu");


  const voltarMenu =
    document.querySelector("#voltarMenu");



  /*
  ENTRAR
  */

  botaoEntrar.addEventListener(
    "click",
    function () {

      entrada.style.display = "none";

    }
  );



  /*
  ABRIR IMAGEM
  */

  botaoImagem1.addEventListener(
    "click",
    function () {

      panorama.setAttribute(
        "visible",
        "true"
      );

      menu.setAttribute(
        "visible",
        "false"
      );

      botaoMenu.setAttribute(
        "visible",
        "true"
      );

    }
  );



  /*
  VOLTAR AO MENU
  */

  voltarMenu.addEventListener(
    "click",
    function () {

      panorama.setAttribute(
        "visible",
        "false"
      );

      menu.setAttribute(
        "visible",
        "true"
      );

      botaoMenu.setAttribute(
        "visible",
        "false"
      );

    }
  );


</script>


</body>

</html>
