<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Teste WebXR - Galeria 360</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>

    body {
      margin: 0;
      background: black;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* TELA INICIAL */

    #entrada {

      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: black;
      color: white;

      z-index: 20;
    }

    #entrada h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    #entrada p {
      color: #aaa;
      margin-bottom: 30px;
    }

    #entrar {

      padding: 16px 32px;

      border: none;
      border-radius: 10px;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      background: white;
      color: black;
    }

  </style>

</head>


<body>


<!-- =============================== -->
<!-- TELA INICIAL -->
<!-- =============================== -->

<div id="entrada">

  <h1>Experiência WebXR</h1>

  <p>
    Escolha e explore imagens em 360°
  </p>

  <button id="entrar">
    ENTRAR
  </button>

</div>



<!-- =============================== -->
<!-- CENA WEBXR -->
<!-- =============================== -->

<a-scene

  background="color: #000000"

  cursor="rayOrigin: mouse"

  raycaster="objects: .clicavel"

>


  <!-- =============================== -->
  <!-- PANORAMA -->
  <!-- =============================== -->

  <a-sky

    id="panorama"

    visible="false"

    rotation="0 -90 0">

  </a-sky>



  <!-- =============================== -->
  <!-- MENU PRINCIPAL -->
  <!-- =============================== -->

  <a-entity

    id="menu"

    position="0 1.6 -2"

  >


    <!-- FUNDO -->

    <a-plane

      width="2"
      height="1.6"

      color="#111111"

      opacity="0.95"

      material="shader: flat">

    </a-plane>



    <!-- TÍTULO -->

    <a-text

      value="ESCOLHA UMA IMAGEM"

      align="center"

      color="#FFFFFF"

      width="1.8"

      position="0 0.55 0.02">

    </a-text>



    <!-- =============================== -->
    <!-- IMAGEM 1 -->
    <!-- =============================== -->

    <a-plane

      id="botao1"

      class="clicavel"

      width="1.4"
      height="0.30"

      position="0 0.15 0.03"

      color="#FFFFFF"

      material="shader: flat">

      <a-text

        value="IMAGEM 1"

        align="center"

        color="#000000"

        width="1.2"

        position="0 0 0.01">

      </a-text>

    </a-plane>



    <!-- =============================== -->
    <!-- IMAGEM 2 -->
    <!-- =============================== -->

    <a-plane

      id="botao2"

      class="clicavel"

      width="1.4"
      height="0.30"

      position="0 -0.20 0.03"

      color="#FFFFFF"

      material="shader: flat">

      <a-text

        value="IMAGEM 2"

        align="center"

        color="#000000"

        width="1.2"

        position="0 0 0.01">

      </a-text>

    </a-plane>



    <!-- =============================== -->
    <!-- IMAGEM 3 -->
    <!-- =============================== -->

    <a-plane

      id="botao3"

      class="clicavel"

      width="1.4"
      height="0.30"

      position="0 -0.55 0.03"

      color="#FFFFFF"

      material="shader: flat">

      <a-text

        value="IMAGEM 3"

        align="center"

        color="#000000"

        width="1.2"

        position="0 0 0.01">

      </a-text>

    </a-plane>


  </a-entity>



  <!-- =============================== -->
  <!-- BOTÃO VOLTAR AO MENU -->
  <!-- =============================== -->

  <a-entity

    id="botaoMenu"

    position="0 1.25 -1.5"

    visible="false"

  >


    <a-plane

      id="voltarMenu"

      class="clicavel"

      width="0.8"
      height="0.28"

      color="#111111"

      opacity="0.9"

      material="shader: flat">

      <a-text

        value="MENU"

        align="center"

        color="#FFFFFF"

        width="0.7"

        position="0 0 0.01">

      </a-text>

    </a-plane>


  </a-entity>



  <!-- =============================== -->
  <!-- CÂMERA -->
  <!-- =============================== -->

  <a-camera>


    <!-- CURSOR CENTRAL -->

    <a-cursor

      fuse="false"

      color="#FFFFFF"

      raycaster="objects: .clicavel">

    </a-cursor>


  </a-camera>


</a-scene>



<script>


  /* ELEMENTOS */

  const entrada =
    document.querySelector("#entrada");

  const entrar =
    document.querySelector("#entrar");

  const panorama =
    document.querySelector("#panorama");

  const menu =
    document.querySelector("#menu");

  const botaoMenu =
    document.querySelector("#botaoMenu");

  const voltarMenu =
    document.querySelector("#voltarMenu");

  const botao1 =
    document.querySelector("#botao1");

  const botao2 =
    document.querySelector("#botao2");

  const botao3 =
    document.querySelector("#botao3");



  /* =============================== */
  /* ENTRAR */
  /* =============================== */

  entrar.addEventListener(
    "click",
    function () {

      entrada.style.display = "none";

    }
  );



  /* =============================== */
  /* FUNÇÃO PARA ABRIR PANORAMA */
  /* =============================== */

  function abrirImagem(endereco) {

    panorama.setAttribute(
      "src",
      endereco
    );

    panorama.setAttribute(
      "visible",
      "true"
    );

    menu.setAttribute(
      "visible",
      "false"
    );

    botaoMenu.setAttribute(
      "visible",
      "true"
    );

  }



  /* =============================== */
  /* IMAGEM 1 */
  /* =============================== */

  botao1.addEventListener(
    "click",
    function () {

      abrirImagem(
        "imagens/imagem360_1.jpg"
      );

    }
  );



  /* =============================== */
  /* IMAGEM 2 */
  /* =============================== */

  botao2.addEventListener(
    "click",
    function () {

      abrirImagem(
        "imagens/imagem360_2.jpg"
      );

    }
  );



  /* =============================== */
  /* IMAGEM 3 */
  /* =============================== */

  botao3.addEventListener(
    "click",
    function () {

      abrirImagem(
        "imagens/imagem360_3.jpg"
      );

    }
  );



  /* =============================== */
  /* VOLTAR PARA O MENU */
  /* =============================== */

  voltarMenu.addEventListener(
    "click",
    function () {

      panorama.setAttribute(
        "visible",
        "false"
      );

      menu.setAttribute(
        "visible",
        "true"
      );

      botaoMenu.setAttribute(
        "visible",
        "false"
      );

    }
  );


</script>


</body>

</html>
