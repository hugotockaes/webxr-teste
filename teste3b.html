<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Galeria 360</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>

    body {
      margin: 0;
      background: black;
      font-family: Arial, Helvetica, sans-serif;
    }

    #entrada {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: black;
      color: white;

      z-index: 20;
    }

    #entrada h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    #entrada p {
      color: #aaa;
      margin-bottom: 30px;
    }

    #entrar {
      padding: 16px 32px;

      border: none;
      border-radius: 10px;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      background: white;
      color: black;
    }

  </style>

</head>


<body>


<!-- TELA INICIAL -->

<div id="entrada">

  <h1>Experiência WebXR</h1>

  <p>
    Escolha uma imagem para explorar
  </p>

  <button id="entrar">
    ENTRAR
  </button>

</div>



<!-- CENA -->

<a-scene

  background="color: #000000"

  cursor="rayOrigin: mouse"

  raycaster="objects: .clicavel"

>


  <!-- ASSETS -->

  <a-assets>

    <img
      id="thumb1"
      src="imagens/thumb_1.jpg">

    <img
      id="thumb2"
      src="imagens/thumb_2.jpg">

    <img
      id="thumb3"
      src="imagens/thumb_3.jpg">

  </a-assets>



  <!-- PANORAMA -->

  <a-sky

    id="panorama"

    visible="false"

    rotation="0 -90 0">

  </a-sky>



  <!-- MENU -->

  <a-entity

    id="menu"

    position="0 1.6 -2.5"

  >


    <!-- FUNDO -->

    <a-plane

      width="3.4"
      height="1.8"

      color="#111111"

      opacity="0.95"

      material="shader: flat">

    </a-plane>



    <!-- TÍTULO -->

    <a-text

      value="ESCOLHA UMA EXPERIENCIA"

      align="center"

      color="#FFFFFF"

      width="2.8"

      position="0 0.65 0.03">

    </a-text>



    <!-- THUMB 1 -->

    <a-plane

      id="botao1"

      class="clicavel"

      src="#thumb1"

      width="0.9"
      height="0.65"

      position="-1.05 -0.05 0.04"

      material="shader: flat">

    </a-plane>



    <!-- THUMB 2 -->

    <a-plane

      id="botao2"

      class="clicavel"

      src="#thumb2"

      width="0.9"
      height="0.65"

      position="0 -0.05 0.04"

      material="shader: flat">

    </a-plane>



    <!-- THUMB 3 -->

    <a-plane

      id="botao3"

      class="clicavel"

      src="#thumb3"

      width="0.9"
      height="0.65"

      position="1.05 -0.05 0.04"

      material="shader: flat">

    </a-plane>


  </a-entity>



  <!-- BOTÃO MENU -->

  <a-entity

    id="botaoMenu"

    position="0 1.2 -1.5"

    visible="false"

  >


    <a-plane

      id="voltarMenu"

      class="clicavel"

      width="0.8"
      height="0.28"

      color="#111111"

      opacity="0.9"

      material="shader: flat">

      <a-text

        value="MENU"

        align="center"

        color="#FFFFFF"

        width="0.7"

        position="0 0 0.01">

      </a-text>

    </a-plane>


  </a-entity>



  <!-- CÂMERA -->

  <a-camera>


    <!-- CURSOR POR OLHAR -->

    <a-cursor

      fuse="true"

      fuse-timeout="3000"

      color="#FFFFFF"

      raycaster="objects: .clicavel"


      animation__fusing="
        property: scale;
        startEvents: fusing;
        easing: easeInCubic;
        dur: 3000;
        from: 1 1 1;
        to: 0.2 0.2 0.2"


      animation__mouseleave="
        property: scale;
        startEvents: mouseleave;
        dur: 200;
        to: 1 1 1"


      animation__click="
        property: scale;
        startEvents: click;
        dur: 150;
        from: 0.2 0.2 0.2;
        to: 1 1 1">

    </a-cursor>


  </a-camera>


</a-scene>



<script>


  const entrada =
    document.querySelector("#entrada");

  const entrar =
    document.querySelector("#entrar");

  const panorama =
    document.querySelector("#panorama");

  const menu =
    document.querySelector("#menu");

  const botaoMenu =
    document.querySelector("#botaoMenu");

  const voltarMenu =
    document.querySelector("#voltarMenu");

  const botao1 =
    document.querySelector("#botao1");

  const botao2 =
    document.querySelector("#botao2");

  const botao3 =
    document.querySelector("#botao3");



  /* ENTRAR */

  entrar.addEventListener(
    "click",
    function () {

      entrada.style.display = "none";

    }
  );



  /* FUNÇÃO PARA ABRIR IMAGEM */

  function abrirImagem(endereco) {

    panorama.setAttribute(
      "src",
      endereco
    );

    panorama.setAttribute(
      "visible",
      "true"
    );

    menu.setAttribute(
      "visible",
      "false"
    );

    botaoMenu.setAttribute(
      "visible",
      "true"
    );

  }



  /* THUMB 1 */

  botao1.addEventListener(
    "click",
    function () {

      abrirImagem(
        "imagens/imagem360_1.jpg"
      );

    }
  );



  /* THUMB 2 */

  botao2.addEventListener(
    "click",
    function () {

      abrirImagem(
        "imagens/imagem360_2.jpg"
      );

    }
  );



  /* THUMB 3 */

  botao3.addEventListener(
    "click",
    function () {

      abrirImagem(
        "imagens/imagem360_3.jpg"
      );

    }
  );



  /* VOLTAR AO MENU */

  voltarMenu.addEventListener(
    "click",
    function () {

      panorama.setAttribute(
        "visible",
        "false"
      );

      menu.setAttribute(
        "visible",
        "true"
      );

      botaoMenu.setAttribute(
        "visible",
        "false"
      );

    }
  );


</script>


</body>

</html>
