<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Galeria WebXR MR</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #info {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(0,0,0,.75);
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="info">
  Galeria MR — entre em AR para visualizar os painéis
</div>

<a-scene
  webxr="
    requiredFeatures: local-floor;
    optionalFeatures: bounded-floor, hand-tracking;
    referenceSpaceType: local-floor;
    overlayElement: #info;
  "
  xr-mode-ui="
    enabled: true;
    XRMode: ar;
  "
  renderer="
    antialias: true;
    alpha: true;
    colorManagement: true;
  "
  background="transparent: true">

  <!-- =========================
       ARQUIVOS
       ========================= -->

  <a-assets>

    <img id="painel01" src="painel01.png">
    <img id="painel02" src="painel02.png">
    <img id="painel03" src="painel03.png">

    <img id="painel04" src="painel04.png">
    <img id="painel05" src="painel05.png">
    <img id="painel06" src="painel06.png">

  </a-assets>


  <!-- ===================================
       GALERIA

       largura painel = 1.20 m
       altura painel  = 1.80 m

       corredor ≈ 3 metros

       visitante começa em:
       x = 0
       z = 0

       galeria segue para frente (-Z)
       =================================== -->


  <!-- ===================================
       LADO ESQUERDO
       PAINÉIS 1 / 2 / 3
       =================================== -->


  <!-- PAINEL 1 -->

  <a-entity position="-1.5 0 -2">

    <!-- estrutura -->
    <a-box
      width="1.26"
      height="1.86"
      depth="0.05"
      position="0 1.15 0"
      color="#222222">
    </a-box>

    <!-- imagem -->
    <a-plane
      src="#painel01"
      width="1.20"
      height="1.80"
      position="0 1.15 0.031">
    </a-plane>

  </a-entity>


  <!-- PAINEL 2 -->

  <a-entity position="-1.5 0 -4">

    <a-box
      width="1.26"
      height="1.86"
      depth="0.05"
      position="0 1.15 0"
      color="#222222">
    </a-box>

    <a-plane
      src="#painel02"
      width="1.20"
      height="1.80"
      position="0 1.15 0.031">
    </a-plane>

  </a-entity>


  <!-- PAINEL 3 -->

  <a-entity position="-1.5 0 -6">

    <a-box
      width="1.26"
      height="1.86"
      depth="0.05"
      position="0 1.15 0"
      color="#222222">
    </a-box>

    <a-plane
      src="#painel03"
      width="1.20"
      height="1.80"
      position="0 1.15 0.031">
    </a-plane>

  </a-entity>



  <!-- ===================================
       LADO DIREITO
       PAINÉIS 4 / 5 / 6

       Rotação 180° para olharem
       para dentro do corredor
       =================================== -->


  <!-- PAINEL 4 -->

  <a-entity
    position="1.5 0 -2"
    rotation="0 180 0">

    <a-box
      width="1.26"
      height="1.86"
      depth="0.05"
      position="0 1.15 0"
      color="#222222">
    </a-box>

    <a-plane
      src="#painel04"
      width="1.20"
      height="1.80"
      position="0 1.15 0.031">
    </a-plane>

  </a-entity>


  <!-- PAINEL 5 -->

  <a-entity
    position="1.5 0 -4"
    rotation="0 180 0">

    <a-box
      width="1.26"
      height="1.86"
      depth="0.05"
      position="0 1.15 0"
      color="#222222">
    </a-box>

    <a-plane
      src="#painel05"
      width="1.20"
      height="1.80"
      position="0 1.15 0.031">
    </a-plane>

  </a-entity>


  <!-- PAINEL 6 -->

  <a-entity
    position="1.5 0 -6"
    rotation="0 180 0">

    <a-box
      width="1.26"
      height="1.86"
      depth="0.05"
      position="0 1.15 0"
      color="#222222">
    </a-box>

    <a-plane
      src="#painel06"
      width="1.20"
      height="1.80"
      position="0 1.15 0.031">
    </a-plane>

  </a-entity>


  <!-- câmera -->

  <a-camera
    position="0 1.6 0"
    wasd-controls-enabled="false">
  </a-camera>


</a-scene>

</body>
</html>
