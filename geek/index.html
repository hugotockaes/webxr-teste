<!-- ==================================================
     INTERAÇÃO POR CURSOR — 2 SEGUNDOS
     Botões 360° = ativa/troca o fundo com fade suave
     Botão MR    = retorna ao passthrough com fade suave
     Os painéis permanecem visíveis o tempo todo.
     ================================================== -->

<script>
let fundoAtivo = null;
let transicaoEmCurso = false;

function fadeSky(opacidadeInicial, opacidadeFinal, duracao, aoTerminar) {
  const sky = document.getElementById('fundo360');
  const inicio = performance.now();

  function quadro(agora) {
    const progresso = Math.min((agora - inicio) / duracao, 1);
    // suavização ease-in-out
    const suave = progresso < 0.5
      ? 2 * progresso * progresso
      : 1 - Math.pow(-2 * progresso + 2, 2) / 2;
    const opacidade = opacidadeInicial + (opacidadeFinal - opacidadeInicial) * suave;
    sky.setAttribute('material', 'opacity', opacidade);
    if (progresso < 1) requestAnimationFrame(quadro);
    else if (aoTerminar) aoTerminar();
  }
  requestAnimationFrame(quadro);
}

function mostrarStatus(texto) {
  const status = document.getElementById('status');
  status.style.display = 'block';
  status.innerHTML = texto;
  clearTimeout(window._statusTimer);
  window._statusTimer = setTimeout(() => { status.style.display = 'none'; }, 1400);
}

function toggleFundo(numero) {
  if (transicaoEmCurso) return;
  if (fundoAtivo === numero) { voltarMR(); return; }
  ativarFundo(numero);
}

function ativarFundo(numero) {
  const sky = document.getElementById('fundo360');
  const asset = document.getElementById('fundo' + numero);
  if (!asset || transicaoEmCurso) return;
  transicaoEmCurso = true;

  const trocar = () => {
    sky.setAttribute('src', '#fundo' + numero);
    sky.setAttribute('visible', true);
    sky.setAttribute('material', 'opacity', 0);
    // pequena espera para a textura entrar antes do fade
    setTimeout(() => {
      fadeSky(0, 1, 1600, () => {
        fundoAtivo = numero;
        transicaoEmCurso = false;
        mostrarStatus('Universo do painel ' + numero + ' ativado');
      });
    }, 120);
  };

  if (fundoAtivo !== null && sky.getAttribute('visible')) {
    const op = parseFloat(sky.getAttribute('material').opacity ?? 1);
    fadeSky(op, 0, 700, trocar);
  } else {
    trocar();
  }
}

function voltarMR() {
  const sky = document.getElementById('fundo360');
  if (transicaoEmCurso) return;
  if (!sky.getAttribute('visible')) {
    fundoAtivo = null;
    mostrarStatus('Realidade mista');
    return;
  }

  transicaoEmCurso = true;
  const material = sky.getAttribute('material') || {};
  const op = Number.isFinite(parseFloat(material.opacity)) ? parseFloat(material.opacity) : 1;
  fadeSky(op, 0, 1400, () => {
    sky.setAttribute('visible', false);
    sky.removeAttribute('src');
    fundoAtivo = null;
    transicaoEmCurso = false;
    mostrarStatus('Realidade mista restaurada');
  });
}
</script>


<!-- ==================================================
     TESTE AUTOMÁTICO DAS IMAGENS
     ================================================== -->

<script>

const arquivos = [

  "painel1a.png",
  "painel1b.png",

  "painel2a.png",
  "painel2b.png",

  "painel3a.png",
  "painel3b.png",

  "painel4a.png",
  "painel4b.png",

  "painel5a.png",
  "painel5b.png",

  "painel6a.png",
  "painel6b.png"

];


let carregadas = 0;
let erros = [];


arquivos.forEach(function(arquivo) {

  const imagem = new Image();


  imagem.onload = function() {

    carregadas++;

    atualizarStatus();

  };


  imagem.onerror = function() {

    erros.push(arquivo);

    atualizarStatus();

  };


  imagem.src = "./" + arquivo;

});


function atualizarStatus() {

  const totalProcessado =
    carregadas + erros.length;


  if(totalProcessado === arquivos.length) {

    const status =
      document.getElementById("status");


    if(erros.length === 0) {

      status.innerHTML =
        "✓ 12 imagens carregadas — Galeria MR pronta";


      setTimeout(function() {

        status.style.display = "none";

      }, 3000);

    }

    else {

      status.innerHTML =
        "ERRO: arquivos não encontrados:<br>" +
        erros.join("<br>");

    }

  }

}

</script>
