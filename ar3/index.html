<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Teste AR - 3 Ativadores</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
    maxTrack: 1;
    filterMinCF: 0.001;
    filterBeta: 0.01;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
  "

  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <!-- ============================= -->
  <!-- ARQUIVOS 3D -->
  <!-- ============================= -->

  <a-assets>

    <a-asset-item
      id="cilindro"
      src="./cilindro.glb">
    </a-asset-item>

    <a-asset-item
      id="cubo"
      src="./cubo.glb">
    </a-asset-item>

    <a-asset-item
      id="esfera"
      src="./esfera.glb">
    </a-asset-item>

  </a-assets>


  <!-- ============================= -->
  <!-- CÂMERA -->
  <!-- ============================= -->

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <!-- ============================= -->
  <!-- ILUMINAÇÃO -->
  <!-- ============================= -->

  <a-light
    type="ambient"
    intensity="1.5">
  </a-light>

  <a-light
    type="directional"
    intensity="2"
    position="1 2 3">
  </a-light>


  <!-- ============================= -->
  <!-- TARGET 0 - JOANINHA -->
  <!-- ============================= -->

  <a-entity mindar-image-target="targetIndex: 0">

    <a-gltf-model
      src="#cilindro"
      position="0 0 0.15"
      rotation="90 0 0"
      scale="0.3 0.3 0.3">
    </a-gltf-model>

  </a-entity>


  <!-- ============================= -->
  <!-- TARGET 1 - PATO -->
  <!-- ============================= -->

  <a-entity mindar-image-target="targetIndex: 1">

    <a-gltf-model
      src="#cubo"
      position="0 0 0.15"
      rotation="90 0 0"
      scale="0.3 0.3 0.3">
    </a-gltf-model>

  </a-entity>


  <!-- ============================= -->
  <!-- TARGET 2 - SAPO -->
  <!-- ============================= -->

  <a-entity mindar-image-target="targetIndex: 2">

    <a-gltf-model
      src="#esfera"
      position="0 0 0.15"
      rotation="90 0 0"
      scale="0.3 0.3 0.3">
    </a-gltf-model>

  </a-entity>


</a-scene>

</body>
</html>
