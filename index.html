<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Exposições | Hugo Duarte Tockaes</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 50px 20px;
      text-align: center;
      background: #000;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    header p {
      color: #aaa;
      margin-top: 12px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 50px 20px;
    }

    .exposicao {
      display: flex;
      gap: 30px;
      background: #1c1c1c;
      padding: 20px;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      transition: 0.3s;
    }

    .exposicao:hover {
      transform: scale(1.02);
      background: #292929;
    }

    .exposicao img {
      width: 350px;
      height: 210px;
      object-fit: cover;
      border-radius: 10px;
    }

    .texto {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .texto h2 {
      margin: 0 0 10px 0;
      font-size: 28px;
    }

    .texto p {
      margin: 0;
      color: #bbb;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-size: 14px;
    }

    @media(max-width: 700px) {

      .exposicao {
        flex-direction: column;
      }

      .exposicao img {
        width: 100%;
        height: auto;
      }

    }

  </style>
</head>

<body>

  <header>
    <h1>Exposições</h1>
    <p>Experiências digitais e ambientes imersivos.</p>
  </header>

  <main class="container">

    <a class="exposicao" href="historia-tv.html">

      <img
        src="imagens/tv.jpg"
        alt="Exposição História da TV Brasileira"
      >

      <div class="texto">

        <h2>História da TV Brasileira</h2>

        <p>
          Uma experiência virtual sobre a evolução da televisão brasileira,
          reunindo aparelhos históricos, conteúdos audiovisuais e elementos
          que marcaram diferentes períodos da televisão no Brasil.
        </p>

      </div>

    </a>

  </main>

  <footer>
    Hugo Duarte Tockaes
  </footer>

</body>

</html>
