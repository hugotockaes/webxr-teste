<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR - 5 Ativadores</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:Arial,sans-serif; }
    .info { position:fixed; z-index:10; top:14px; left:50%; transform:translateX(-50%); color:white; background:rgba(0,0,0,.55); padding:10px 16px; border-radius:14px; text-align:center; pointer-events:none; }
  </style>
</head>
<body>
  <div class="info">Aponte a câmera para um dos ativadores</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 5; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5; warmupTolerance: 5"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="imagem1" src="./imagem1.png">
      <img id="imagem2" src="./imagem2.png">
      <img id="imagem3" src="./imagem3.png">
      <img id="imagem4" src="./imagem4.png">
      <img id="imagem5" src="./imagem5.png">
    </a-assets>

    <!-- A ordem abaixo corresponde à ordem usada no MindAR Compiler. -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-image src="#imagem1" position="0 0 0" height="1" width="1" material="transparent:true; alphaTest:0.01" rotation="0 0 0"></a-image>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1">
      <a-image src="#imagem2" position="0 0 0" height="1" width="1" material="transparent:true; alphaTest:0.01" rotation="0 0 0"></a-image>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 2">
      <a-image src="#imagem3" position="0 0 0" height="1" width="1" material="transparent:true; alphaTest:0.01" rotation="0 0 0"></a-image>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 3">
      <a-image src="#imagem4" position="0 0 0" height="1" width="1" material="transparent:true; alphaTest:0.01" rotation="0 0 0"></a-image>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 4">
      <a-image src="#imagem5" position="0 0 0" height="1" width="1" material="transparent:true; alphaTest:0.01" rotation="0 0 0"></a-image>
    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>
</body>
</html>
