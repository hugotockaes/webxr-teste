<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Teste 5 — Visualizador 3D SBS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
    }

    #interface {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;

      padding: 18px 22px;

      background: rgba(25, 25, 25, 0.75);
      backdrop-filter: blur(10px);

      border-radius: 18px;

      color: white;
      text-align: center;
    }

    #titulo {
      font-size: 18px;
      font-weight: bold;
    }

    #status {
      font-size: 13px;
      opacity: 0.7;
    }

    #escolher {
      border: none;
      border-radius: 12px;

      padding: 12px 22px;

      background: #555;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    #escolher:hover {
      background: #777;
    }

    #arquivo {
      display: none;
    }
  </style>


  <script type="importmap">
  {
    "imports": {
      "three":
      "https://unpkg.com/three@0.180.0/build/three.module.js",

      "three/addons/":
      "https://unpkg.com/three@0.180.0/examples/jsm/"
    }
  }
  </script>

</head>


<body>


<div id="interface">

  <div id="titulo">
    Visualizador 3D SBS
  </div>

  <button id="escolher">
    Escolher imagem 3D
  </button>

  <input
    type="file"
    id="arquivo"
    accept="image/jpeg,image/png,image/webp"
  >

  <div id="status">
    Nenhuma imagem carregada
  </div>

</div>



<script type="module">

import * as THREE from "three";

import {
  VRButton
} from "three/addons/webxr/VRButton.js";



let scene;
let camera;
let renderer;

let previewPlane;

let leftPlane;
let rightPlane;



/* ==============================
   INICIALIZAÇÃO
================================ */

init();



function init() {

  scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x000000);



  camera =
    new THREE.PerspectiveCamera(

      60,

      window.innerWidth /
      window.innerHeight,

      0.1,

      100

    );



  camera.position.set(
    0,
    0,
    0
  );



  renderer =
    new THREE.WebGLRenderer({

      antialias: true

    });



  renderer.setPixelRatio(
    window.devicePixelRatio
  );



  renderer.setSize(

    window.innerWidth,

    window.innerHeight

  );



  renderer.xr.enabled = true;



  document.body.appendChild(
    renderer.domElement
  );



  document.body.appendChild(

    VRButton.createButton(
      renderer
    )

  );



  renderer.setAnimationLoop(
    render
  );



  window.addEventListener(

    "resize",

    resize

  );

}



/* ==============================
   BOTÃO ESCOLHER IMAGEM
================================ */


const botao =
  document.getElementById(
    "escolher"
  );


const arquivo =
  document.getElementById(
    "arquivo"
  );


const status =
  document.getElementById(
    "status"
  );



botao.addEventListener(

  "click",

  () => {

    arquivo.click();

  }

);



arquivo.addEventListener(

  "change",

  function(event) {


    const file =
      event.target.files[0];


    if (!file) return;



    status.innerHTML =
      "Carregando...";



    const url =
      URL.createObjectURL(file);



    carregarImagem(
      url,
      file.name
    );

  }

);



/* ==============================
   CARREGAR IMAGEM
================================ */


function carregarImagem(
  url,
  nome
) {


  const loader =
    new THREE.TextureLoader();



  loader.load(

    url,


    function(texture) {


      texture.colorSpace =
        THREE.SRGBColorSpace;



      criarImagemStereo(
        texture
      );



      status.innerHTML =
        "Carregada: " +
        nome;



      URL.revokeObjectURL(
        url
      );

    },


    undefined,


    function(error) {


      console.error(
        error
      );


      status.innerHTML =
        "Erro ao carregar imagem";

    }

  );

}



/* ==============================
   CRIAR FOTO SBS
================================ */


function criarImagemStereo(
  texture
) {


  /* Remove imagem anterior */


  if (previewPlane) {

    scene.remove(
      previewPlane
    );

  }


  if (leftPlane) {

    scene.remove(
      leftPlane
    );

  }


  if (rightPlane) {

    scene.remove(
      rightPlane
    );

  }



  /* ==========================
     TAMANHO DA TELA
  ========================== */


  const distancia = 2.5;

  const largura = 2.8;



  /*
     A imagem SBS possui:

     metade esquerda
     +
     metade direita

     Então calculamos a proporção
     usando apenas metade da largura.
  */


  const proporcaoOlho =

    (texture.image.width / 2)

    /

    texture.image.height;



  const altura =

    largura /

    proporcaoOlho;



  const geometry =

    new THREE.PlaneGeometry(

      largura,

      altura

    );



  /* ==========================
     PREVIEW 2D
  ========================== */


  const previewTexture =
    texture.clone();



  previewTexture.repeat.set(

    0.5,

    1

  );



  previewTexture.offset.set(

    0,

    0

  );



  previewTexture.needsUpdate =
    true;



  const previewMaterial =

    new THREE.MeshBasicMaterial({

      map:
        previewTexture,

      side:
        THREE.DoubleSide

    });



  previewPlane =

    new THREE.Mesh(

      geometry,

      previewMaterial

    );



  previewPlane.position.set(

    0,

    0,

    -distancia

  );



  previewPlane.layers.set(
    0
  );



  scene.add(
    previewPlane
  );



  /* ==========================
     OLHO ESQUERDO
  ========================== */


  const texturaEsquerda =
    texture.clone();



  texturaEsquerda.repeat.set(

    0.5,

    1

  );



  texturaEsquerda.offset.set(

    0,

    0

  );



  texturaEsquerda.needsUpdate =
    true;



  const materialEsquerdo =

    new THREE.MeshBasicMaterial({

      map:
        texturaEsquerda,

      side:
        THREE.DoubleSide

    });



  leftPlane =

    new THREE.Mesh(

      geometry,

      materialEsquerdo

    );



  leftPlane.position.set(

    0,

    0,

    -distancia

  );



  leftPlane.layers.set(
    1
  );



  scene.add(
    leftPlane
  );



  /* ==========================
     OLHO DIREITO
  ========================== */


  const texturaDireita =
    texture.clone();



  texturaDireita.repeat.set(

    0.5,

    1

  );



  texturaDireita.offset.set(

    0.5,

    0

  );



  texturaDireita.needsUpdate =
    true;



  const materialDireito =

    new THREE.MeshBasicMaterial({

      map:
        texturaDireita,

      side:
        THREE.DoubleSide

    });



  rightPlane =

    new THREE.Mesh(

      geometry,

      materialDireito

    );



  rightPlane.position.set(

    0,

    0,

    -distancia

  );



  rightPlane.layers.set(
    2
  );



  scene.add(
    rightPlane
  );

}



/* ==============================
   RENDER
================================ */


function render() {


  if (
    renderer.xr.isPresenting
  ) {


    /*
       Esconde preview normal
       quando entra no VR
    */


    if (previewPlane) {

      previewPlane.visible =
        false;

    }



    const xrCamera =

      renderer.xr.getCamera(
        camera
      );



    if (

      xrCamera.cameras &&

      xrCamera.cameras.length >= 2

    ) {


      const olhoEsquerdo =

        xrCamera.cameras[0];


      const olhoDireito =

        xrCamera.cameras[1];



      /*
         OLHO ESQUERDO
         camada 1
      */


      olhoEsquerdo.layers.set(
        1
      );



      /*
         OLHO DIREITO
         camada 2
      */


      olhoDireito.layers.set(
        2
      );

    }


  }


  else {


    /*
       Fora do VR:
       mostra somente o preview
       do olho esquerdo.
    */


    if (previewPlane) {

      previewPlane.visible =
        true;

    }


    camera.layers.set(
      0
    );

  }



  renderer.render(

    scene,

    camera

  );

}



/* ==============================
   RESIZE
================================ */


function resize() {


  camera.aspect =

    window.innerWidth /

    window.innerHeight;



  camera.updateProjectionMatrix();



  renderer.setSize(

    window.innerWidth,

    window.innerHeight

  );

}


</script>


</body>
</html>
