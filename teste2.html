<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Experiência 360°</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>

    body {
      margin: 0;
      background: black;
      font-family: Arial, Helvetica, sans-serif;
    }

    #entrada {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: black;
      color: white;

      z-index: 10;
    }

    #entrada h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    #entrada p {
      color: #aaa;
      margin-bottom: 30px;
    }

    #entrar {
      padding: 16px 32px;

      font-size: 18px;

      border: none;
      border-radius: 8px;

      cursor: pointer;

      background: white;
      color: black;
    }

    #entrar:hover {
      background: #ddd;
    }

  </style>

</head>


<body>


<!-- TELA DE ENTRADA -->

<div id="entrada">

  <h1>Experiência 360°</h1>

  <p>
    Explore o ambiente em 360 graus.
  </p>

  <button id="entrar">
    ENTRAR
  </button>

</div>



<!-- CENA WEBXR -->

<a-scene>

 <a-sky
    src="https://raw.githubusercontent.com/hugotockaes/webxr-teste/main/imagens/imagem360.jpg"
    rotation="0 -90 0">
  </a-sky>

  <a-camera></a-camera>

</a-scene>


<script>

  const botao = document.querySelector("#entrar");
  const entrada = document.querySelector("#entrada");

  botao.addEventListener("click", function () {

    entrada.style.display = "none";

  });

</script>


</body>

</html>
