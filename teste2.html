<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Experiência 360°</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>

    body {
      margin: 0;
      background: black;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* TELA DE ENTRADA */

    #entrada {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: black;
      color: white;

      z-index: 10;
    }

    #entrada h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    #status {
      color: #aaa;
      margin-bottom: 30px;
    }

    /* LOADING */

    #loading {
      width: 40px;
      height: 40px;

      border: 4px solid #333;
      border-top: 4px solid white;

      border-radius: 50%;

      animation: girar 1s linear infinite;

      margin-bottom: 25px;
    }

    @keyframes girar {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

    /* BOTÃO */

    #entrar {
      display: none;

      padding: 16px 32px;

      font-size: 18px;

      border: none;
      border-radius: 8px;

      cursor: pointer;

      background: white;
      color: black;
    }

    #entrar:hover {
      background: #ddd;
    }

  </style>

</head>


<body>


<!-- TELA DE ENTRADA -->

<div id="entrada">

  <h1>Experiência 360°</h1>

  <div id="loading"></div>

  <p id="status">
    Carregando imagem 360°...
  </p>

  <button id="entrar">
    ENTRAR
  </button>

</div>



<!-- CENA WEBXR -->

<a-scene>

  <a-assets>

    <img
      id="imagem360"
      src="https://raw.githubusercontent.com/hugotockaes/webxr-teste/main/imagens/imagem360.jpg"
      crossorigin="anonymous"
    >

  </a-assets>


  <a-sky
    src="#imagem360"
    rotation="0 -90 0">
  </a-sky>


  <a-camera></a-camera>

</a-scene>



<script>

  const imagem = document.querySelector("#imagem360");

  const loading = document.querySelector("#loading");
  const status = document.querySelector("#status");

  const botao = document.querySelector("#entrar");
  const entrada = document.querySelector("#entrada");


  /* QUANDO A IMAGEM TERMINAR DE CARREGAR */

  imagem.addEventListener("load", function () {

    loading.style.display = "none";

    status.innerHTML = "Experiência pronta.";

    botao.style.display = "block";

  });


  /* BOTÃO ENTRAR */

  botao.addEventListener("click", function () {

    entrada.style.display = "none";

  });


</script>


</body>

</html>
