<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Experiência 360°</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>

    body {
      margin: 0;
      background: black;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* TELA DE ENTRADA */

    #entrada {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: black;
      color: white;

      z-index: 10;
    }

    #entrada h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    #status {
      color: #aaa;
      margin-bottom: 30px;
    }

    /* LOADING */

    #loading {
      width: 40px;
      height: 40px;

      border: 4px solid #333;
      border-top: 4px solid white;

      border-radius: 50%;

      animation: girar 1s linear infinite;

      margin-bottom: 25px;
    }

    @keyframes girar {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

    /* BOTÃO */

    #entrar {
      display: none;

      padding: 16px 32px;

      font-size: 18px;

      border: none;
      border-radius: 8px;

      cursor: pointer;

      background: white;
      color: black;
    }

    #entrar:hover {
      background: #ddd;
    }

  </style>

</head>


<body>


<!-- TELA DE ENTRADA -->

<div id="entrada">

  <h1>Experiência 360°</h1>

  <div id="loading"></div>

  <p id="status">
    Carregando imagem 360°...
  </p>

  <button id="entrar">
    ENTRAR
  </button>

</div>



<!-- CENA WEBXR -->

<a-scene>

  <!-- ASSETS -->

  <a-assets>

    <img
      id="imagem360"
      src="imagens/imagem360.jpg"
    >

  </a-assets>


  <!-- PANORAMA 360 -->

  <a-sky
    src="#imagem360"
    rotation="0 -90 0">
  </a-sky>


  <!-- CÂMERA -->

  <a-camera>
  </a-camera>


</a-scene>



<script>

  /*
  ELEMENTOS DA PÁGINA
  */

  const imagem = document.querySelector("#imagem360");

  const loading = document.querySelector("#loading");

  const status = document.querySelector("#status");

  const botao = document.querySelector("#entrar");

  const entrada = document.querySelector("#entrada");


  /*
  FUNÇÃO: IMAGEM CARREGADA
  */

  function imagemPronta() {

    console.log("Imagem 360 carregada!");

    loading.style.display = "none";

    status.innerHTML = "Experiência pronta.";

    botao.style.display = "block";

  }


  /*
  FUNÇÃO: ERRO
  */

  function erroImagem() {

    console.log("Erro ao carregar imagem.");

    loading.style.display = "none";

    status.innerHTML =
      "Erro ao carregar a imagem 360°.";

  }


  /*
  VERIFICA SE A IMAGEM
  JÁ ESTAVA CARREGADA
  */

  if (
    imagem.complete &&
    imagem.naturalWidth > 0
  ) {

    imagemPronta();

  }

  else {

    imagem.addEventListener(
      "load",
      imagemPronta
    );

    imagem.addEventListener(
      "error",
      erroImagem
    );

  }


  /*
  BOTÃO ENTRAR
  */

  botao.addEventListener(
    "click",
    function () {

      entrada.style.display = "none";

    }
  );


</script>


</body>

</html>
