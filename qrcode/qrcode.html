<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>VR Experience — QR Scanner</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
    color: white;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

}

.container {

    width: 90%;
    max-width: 700px;

    text-align: center;

}

h1 {

    font-size: 42px;

    margin-bottom: 10px;

}

#instrucao {

    font-size: 20px;

    color: #aaa;

    margin-bottom: 25px;

}

button {

    padding: 18px 40px;

    border: none;

    border-radius: 14px;

    background: white;
    color: black;

    font-size: 22px;
    font-weight: bold;

    cursor: pointer;

}


/* SCANNER */

#scannerArea {

    display: none;

    margin-top: 30px;

}


.scanner {

    width: 320px;
    height: 320px;

    max-width: 85vw;

    margin: auto;

    position: relative;

    overflow: hidden;

}


/* área onde a câmera será colocada */

#reader {

    position: absolute;

    width: 100%;
    height: 100%;

    top: 0;
    left: 0;

}


/* deixa vídeo ocupar área */

#reader video {

    width: 100% !important;
    height: 100% !important;

    object-fit: cover;

}


/* MOLDURA */

.frame {

    position: absolute;

    width: 100%;
    height: 100%;

    top: 0;
    left: 0;

    z-index: 10;

    pointer-events: none;

}


/* CANTOS */

.corner {

    position: absolute;

    width: 55px;
    height: 55px;

    border-color: white;
    border-style: solid;

}

.top-left {

    top: 0;
    left: 0;

    border-width: 5px 0 0 5px;

}

.top-right {

    top: 0;
    right: 0;

    border-width: 5px 5px 0 0;

}

.bottom-left {

    bottom: 0;
    left: 0;

    border-width: 0 0 5px 5px;

}

.bottom-right {

    bottom: 0;
    right: 0;

    border-width: 0 5px 5px 0;

}


/* LINHA DO SCANNER */

.scanLine {

    position: absolute;

    left: 5%;

    width: 90%;
    height: 3px;

    background: white;

    box-shadow:
    0 0 12px white;

    animation:
    scanning 2s linear infinite;

}

@keyframes scanning {

    0% {
        top: 5%;
    }

    50% {
        top: 94%;
    }

    100% {
        top: 5%;
    }

}


/* STATUS */

.status {

    margin-top: 25px;

    font-size: 18px;

    letter-spacing: 2px;

}

.loader {

    display: inline-block;

    width: 14px;
    height: 14px;

    margin-right: 10px;

    border: 3px solid #555;

    border-top-color: white;

    border-radius: 50%;

    animation:
    loading 0.8s linear infinite;

}

@keyframes loading {

    to {
        transform: rotate(360deg);
    }

}


/* RESULTADO */

#resultado {

    display: none;

    margin-top: 30px;

    padding: 25px;

    background: #111;

    border-radius: 15px;

}

#conteudoQR {

    margin-top: 12px;

    font-size: 26px;

    font-weight: bold;

    word-break: break-word;

}


/* WEBXR / QUEST */
#vrPanel {
    margin-top: 22px;
}
#btnVR {
    background: #fff;
    color: #000;
}
#vrAviso {
    margin-top: 14px;
    color: #888;
    font-size: 14px;
    line-height: 1.45;
}
canvas#xrCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    background: #000;
}

</style>

</head>


<body>

<div class="container">


<h1>
VR EXPERIENCE
</h1>


<p id="instrucao">

Pegue um card e pressione o botão abaixo.

</p>


<button id="btnLer">

LER CARD

</button>




<div id="vrPanel">
    <button id="btnVR">ENTRAR EM VR</button>
    <div id="vrAviso">
        No Quest, este botão inicia uma sessão WebXR imersiva.
    </div>
</div>

<canvas id="xrCanvas"></canvas>


<!-- SCANNER -->

<div id="scannerArea">


<div class="scanner">


<div id="reader"></div>


<div class="frame">


<div class="corner top-left"></div>

<div class="corner top-right"></div>

<div class="corner bottom-left"></div>

<div class="corner bottom-right"></div>


<div class="scanLine"></div>


</div>


</div>



<div class="status">

<span class="loader"></span>

<span id="statusTexto">

PROCURANDO QR CODE...

</span>

</div>


</div>



<!-- RESULTADO -->


<div id="resultado">

<div>

CARD IDENTIFICADO

</div>

<div id="conteudoQR"></div>

</div>


</div>



<script
src="https://unpkg.com/html5-qrcode">
</script>



<script>


const botao =
document.getElementById("btnLer");


const scannerArea =
document.getElementById("scannerArea");


const resultado =
document.getElementById("resultado");


const conteudoQR =
document.getElementById("conteudoQR");


const instrucao =
document.getElementById("instrucao");


const statusTexto =
document.getElementById("statusTexto");


let scanner = null;


let xrSession = null;
let xrRefSpace = null;
let gl = null;
let xrSupported = false;

const btnVR = document.getElementById("btnVR");
const vrPanel = document.getElementById("vrPanel");
const xrCanvas = document.getElementById("xrCanvas");

async function verificarWebXR() {
    if (!navigator.xr) {
        btnVR.disabled = true;
        btnVR.innerText = "WEBXR NÃO DISPONÍVEL";
        document.getElementById("vrAviso").innerText =
            "Abra esta página no Meta Quest Browser por HTTPS.";
        return;
    }

    try {
        xrSupported = await navigator.xr.isSessionSupported("immersive-vr");
        if (!xrSupported) {
            btnVR.disabled = true;
            btnVR.innerText = "VR NÃO SUPORTADO";
        }
    } catch (e) {
        console.error(e);
    }
}

btnVR.addEventListener("click", entrarVR);

async function entrarVR() {
    if (!navigator.xr || !xrSupported) return;

    try {
        xrSession = await navigator.xr.requestSession("immersive-vr", {
            optionalFeatures: ["local-floor", "bounded-floor"]
        });

        gl = xrCanvas.getContext("webgl", {
            xrCompatible: true,
            alpha: false,
            antialias: true
        });

        await gl.makeXRCompatible();

        xrSession.updateRenderState({
            baseLayer: new XRWebGLLayer(xrSession, gl)
        });

        xrRefSpace = await xrSession.requestReferenceSpace("local");

        xrCanvas.style.display = "block";
        document.querySelector(".container").style.display = "none";

        xrSession.addEventListener("end", sairVR);
        xrSession.requestAnimationFrame(renderXR);
    } catch (erro) {
        console.error(erro);
        document.getElementById("vrAviso").innerText =
            "Não foi possível iniciar o modo VR: " + erro.message;
    }
}

function renderXR(time, frame) {
    if (!xrSession) return;

    const session = frame.session;
    const pose = frame.getViewerPose(xrRefSpace);
    const layer = session.renderState.baseLayer;

    gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
    gl.clearColor(0.015, 0.015, 0.02, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    if (pose) {
        for (const view of pose.views) {
            const viewport = layer.getViewport(view);
            gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);

            // Fundo escuro proposital para confirmar que o Quest
            // realmente entrou numa sessão WebXR imersiva.
            gl.enable(gl.SCISSOR_TEST);

            // Moldura central simples em coordenadas de tela de cada olho.
            const w = Math.floor(viewport.width * 0.36);
            const h = Math.floor(viewport.height * 0.36);
            const x = viewport.x + Math.floor((viewport.width - w) / 2);
            const y = viewport.y + Math.floor((viewport.height - h) / 2);

            gl.scissor(x, y, w, h);
            gl.clearColor(0.08, 0.08, 0.10, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.disable(gl.SCISSOR_TEST);
        }
    }

    session.requestAnimationFrame(renderXR);
}

function sairVR() {
    xrSession = null;
    xrCanvas.style.display = "none";
    document.querySelector(".container").style.display = "block";
}

verificarWebXR();




botao.addEventListener(
"click",
iniciarScanner
);



async function iniciarScanner() {


botao.style.display =
"none";


resultado.style.display =
"none";


scannerArea.style.display =
"block";


instrucao.innerText =
"Aponte para o QR Code";


statusTexto.innerText =
"SOLICITANDO CÂMERA...";


try {


scanner =
new Html5Qrcode("reader");



const cameras =
await Html5Qrcode.getCameras();



console.log(
"Câmeras:",
cameras
);



if (
!cameras ||
cameras.length === 0
) {

throw new Error(
"Nenhuma câmera disponível."
);

}



statusTexto.innerText =
"CÂMERA ENCONTRADA — INICIANDO...";



await scanner.start(


{

facingMode: {

ideal:
"environment"

}

},


{

fps: 10,

qrbox: {

width: 250,
height: 250

}

},


qrEncontrado,


function() {

statusTexto.innerText =
"PROCURANDO QR CODE...";

}


);



statusTexto.innerText =
"PROCURANDO QR CODE...";


}


catch (erro) {


console.error(
erro
);


statusTexto.innerText =
"ERRO AO ACESSAR CÂMERA";


instrucao.innerText =
erro.message;


botao.innerText =
"TENTAR NOVAMENTE";


botao.style.display =
"inline-block";


}


}



async function qrEncontrado(texto) {


statusTexto.innerText =
"QR CODE ENCONTRADO!";


try {


await scanner.stop();

await scanner.clear();


}

catch (erro) {

console.log(
erro
);

}



scannerArea.style.display =
"none";


resultado.style.display =
"block";


conteudoQR.innerText =
texto;


instrucao.innerText =
"Leitura concluída";


botao.innerText =
"LER OUTRO CARD";


botao.style.display =
"inline-block";


}


</script>


</body>

</html>
