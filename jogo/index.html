<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XR Target</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>body{margin:0;font-family:Arial;background:#111;color:white}#ui{position:fixed;z-index:10;top:15px;left:15px;background:#222d;padding:15px;border-radius:12px;width:280px}button{width:100%;padding:12px;font-weight:bold;margin-top:10px}</style></head><body>
<div id="ui"><b>XR TARGET — PROTÓTIPO</b><p>SCORE: <span id="score">0</span><br>ACERTOS: <span id="hits">0</span><br>TEMPO: <span id="time">60</span>s</p><button id="start">INICIAR TESTE</button><small>No Quest: entre em XR, aponte para o círculo e aperte o gatilho.</small></div>
<a-scene webxr="optionalFeatures:local-floor,dom-overlay;overlayElement:#ui">
<a-entity><a-camera position="0 1.7 0"></a-camera><a-entity id="L" laser-controls="hand:left" raycaster="objects:.target"></a-entity><a-entity id="R" laser-controls="hand:right" raycaster="objects:.target"></a-entity></a-entity>
<a-circle id="target" class="target" radius=".22" material="color:#ff3344;shader:flat" visible="false"></a-circle></a-scene>
<script>
let s=0,h=0,on=false,end=0,tm,hide,ctx;const t=document.querySelector('#target');
function sound(f=880,d=.13){ctx??=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.15,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}
function spawn(){if(!on)return;let a=(Math.random()-0.5)*2.6,r=2+Math.random()*1.2,y=1+Math.random()*1.2;t.setAttribute('position',`${Math.sin(a)*r} ${y} ${-Math.cos(a)*r}`);t.setAttribute('visible',true);sound();clearTimeout(hide);hide=setTimeout(()=>{t.setAttribute('visible',false);setTimeout(spawn,450)},2200)}
function hit(){if(!on||!t.getAttribute('visible'))return;clearTimeout(hide);s+=100;h++;score.textContent=s;hits.textContent=h;sound(180,.2);t.setAttribute('animation','property:scale;from:1 1 1;to:2.8 2.8 2.8;dur:150');setTimeout(()=>{t.removeAttribute('animation');t.setAttribute('scale','1 1 1');t.setAttribute('visible',false);setTimeout(spawn,250)},170)}
function trigger(e){if((e.detail.intersectedEls||[]).includes(t))hit()}L.addEventListener('triggerdown',trigger);R.addEventListener('triggerdown',trigger);t.addEventListener('click',hit);
start.onclick=()=>{s=h=0;score.textContent=hits.textContent=0;on=true;end=Date.now()+60000;clearInterval(tm);spawn();tm=setInterval(()=>{let x=Math.max(0,Math.ceil((end-Date.now())/1000));time.textContent=x;if(!x){on=false;clearInterval(tm);clearTimeout(hide);t.setAttribute('visible',false);start.textContent='JOGAR NOVAMENTE'}},200)}
</script></body></html>
