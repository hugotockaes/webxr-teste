<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Galeria 360</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>


  <style>

    body {

      margin: 0;

      background: #000000;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    /* =============================== */
    /* ENTRADA */
    /* =============================== */

    #entrada {

      position: fixed;

      inset: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      background: #000000;

      color: white;

      z-index: 20;

    }


    #entrada h1 {

      font-size: 34px;

      margin-bottom: 10px;

    }


    #entrada p {

      color: #999999;

      margin-bottom: 30px;

    }


    #entrar {

      padding: 16px 32px;

      border: none;

      border-radius: 12px;

      background: #666666;

      color: #ffffff;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }

  </style>

</head>


<body>


<!-- =============================== -->
<!-- TELA INICIAL -->
<!-- =============================== -->

<div id="entrada">

  <h1>
    Experiência WebXR
  </h1>

  <p>
    Entre para explorar
  </p>

  <button id="entrar">
    ENTRAR
  </button>

</div>



<!-- =============================== -->
<!-- ÁUDIO -->
<!-- =============================== -->

<audio

  id="musica"

  src="musicas/mixkit-sun-and-his-daughter-580.mp3"

  preload="auto"

  loop>

</audio>



<!-- =============================== -->
<!-- CENA -->
<!-- =============================== -->

<a-scene

  background="color: #000000"

  cursor="rayOrigin: mouse"

  raycaster="objects: .clicavel"

>


  <!-- =============================== -->
  <!-- PANORAMA -->
  <!-- =============================== -->

  <a-sky

    id="panorama"

    src="imagens/imagem360_1.jpg"

    rotation="0 -90 0">

  </a-sky>



  <!-- =============================== -->
  <!-- MENU -->
  <!-- MENU COMPACTO -->
  <!-- =============================== -->

  <a-entity

    id="menu"

    position="0 1.25 -1.7"

    scale="0.75 0.75 0.75"

  >


    <!-- =============================== -->
    <!-- FUNDO -->
    <!-- CINZA CLARO 50% / FUNDO RETO -->
    <!-- =============================== -->
    <!-- FUNDO RETO, SEM CANTOS ARREDONDADOS -->
    <a-plane
      width="1.90"
      height="0.55"
      color="#BDBDBD"
      opacity="0.5"
      material="
        shader: flat;
        transparent: true">
    </a-plane>


    <!-- =============================== -->
    <!-- TÍTULO -->
    <!-- =============================== -->

    <a-plane

      width="1.05"

      height="0.15"

      position="0 0.145 0.02"

      color="#888888"

      opacity="0.55"

      material="
        shader: flat;
        transparent: true">

    </a-plane>


    <a-text

      value="GALERIA 360"

      align="center"

      color="#FFFFFF"

      width="0.92"

      position="0 0.145 0.04">

    </a-text>



    <!-- =============================== -->
    <!-- BOTÃO ANTERIOR -->
    <!-- =============================== -->

    <a-entity

      id="anterior"

      class="clicavel"

      position="-0.31 -0.105 0.04"

      animation__mouseenter="
        property: scale;
        startEvents: mouseenter;
        dur: 150;
        to: 1.10 1.10 1.10"

      animation__mouseleave="
        property: scale;
        startEvents: mouseleave;
        dur: 150;
        to: 1 1 1"

    >


      <!-- CORPO -->

      <a-plane

        width="0.47"

        height="0.20"

        color="#666666"

        material="shader: flat">

      </a-plane>


      <!-- LADO ESQUERDO -->

      <a-circle

        radius="0.10"

        position="-0.235 0 0"

        color="#666666"

        material="shader: flat">

      </a-circle>


      <!-- LADO DIREITO -->

      <a-circle

        radius="0.10"

        position="0.235 0 0"

        color="#666666"

        material="shader: flat">

      </a-circle>


      <!-- TEXTO MAIOR -->

      <a-text

        value="< ANTERIOR"

        align="center"

        color="#FFFFFF"

        width="0.54"

        position="0 0 0.025">

      </a-text>


      <!-- ÁREA INVISÍVEL DE INTERAÇÃO -->

      <a-plane

        class="clicavel"

        width="0.67"

        height="0.23"

        position="0 0 0.04"

        material="
          transparent: true;
          opacity: 0.001">

      </a-plane>


    </a-entity>



    <!-- =============================== -->
    <!-- BOTÃO PRÓXIMA -->
    <!-- =============================== -->

    <a-entity

      id="proxima"

      class="clicavel"

      position="0.31 -0.105 0.04"

      animation__mouseenter="
        property: scale;
        startEvents: mouseenter;
        dur: 150;
        to: 1.10 1.10 1.10"

      animation__mouseleave="
        property: scale;
        startEvents: mouseleave;
        dur: 150;
        to: 1 1 1"

    >


      <!-- CORPO -->

      <a-plane

        width="0.47"

        height="0.20"

        color="#666666"

        material="shader: flat">

      </a-plane>


      <!-- LADO ESQUERDO -->

      <a-circle

        radius="0.10"

        position="-0.235 0 0"

        color="#666666"

        material="shader: flat">

      </a-circle>


      <!-- LADO DIREITO -->

      <a-circle

        radius="0.10"

        position="0.235 0 0"

        color="#666666"

        material="shader: flat">

      </a-circle>


      <!-- TEXTO MAIOR -->

      <a-text

        value="PROXIMA >"

        align="center"

        color="#FFFFFF"

        width="0.54"

        position="0 0 0.025">

      </a-text>


      <!-- ÁREA INVISÍVEL -->

      <a-plane

        class="clicavel"

        width="0.67"

        height="0.23"

        position="0 0 0.04"

        material="
          transparent: true;
          opacity: 0.001">

      </a-plane>


    </a-entity>


  </a-entity>



  <!-- =============================== -->
  <!-- CÂMERA -->
  <!-- =============================== -->

  <a-camera>


    <!-- =============================== -->
    <!-- MIRA -->
    <!-- AGORA 1 SEGUNDO -->
    <!-- =============================== -->

    <a-cursor

      fuse="true"

      fuse-timeout="1000"

      color="#FFFFFF"

      raycaster="
        objects: .clicavel"


      animation__fusing="
        property: scale;
        startEvents: fusing;
        easing: easeInCubic;
        dur: 1000;
        from: 1 1 1;
        to: 0.2 0.2 0.2"


      animation__mouseleave="
        property: scale;
        startEvents: mouseleave;
        dur: 150;
        to: 1 1 1"

    >

    </a-cursor>



    <!-- =============================== -->
    <!-- FADE PRETO -->
    <!-- =============================== -->

    <a-plane

      id="fade"

      position="0 0 -0.3"

      width="4"

      height="4"

      color="#000000"

      material="
        shader: flat;
        transparent: true;
        opacity: 0">

    </a-plane>


  </a-camera>


</a-scene>




<script>


/* ===================================== */
/* ELEMENTOS */
/* ===================================== */

const entrada =
  document.querySelector("#entrada");


const entrar =
  document.querySelector("#entrar");


const musica =
  document.querySelector("#musica");


const panorama =
  document.querySelector("#panorama");


const proxima =
  document.querySelector("#proxima");


const anterior =
  document.querySelector("#anterior");


const fade =
  document.querySelector("#fade");



/* ===================================== */
/* ESTADO */
/* ===================================== */

let imagemAtual = 1;

let trocando = false;



/* ===================================== */
/* CAMINHO AUTOMÁTICO DA IMAGEM */
/* ===================================== */

function enderecoImagem(numero) {

  return (
    "imagens/imagem360_" +
    numero +
    ".jpg"
  );

}


/* ===================================== */
/* DESCOBRE AUTOMATICAMENTE A ÚLTIMA     */
/* IMAGEM DA SEQUÊNCIA                   */
/* ===================================== */

function imagemExiste(numero) {

  return new Promise(function(resolve) {

    const teste = new Image();

    teste.onload = function() {
      resolve(true);
    };

    teste.onerror = function() {
      resolve(false);
    };

    teste.src = enderecoImagem(numero);

  });

}


/* ===================================== */
/* ENCONTRA A ÚLTIMA IMAGEM              */
/* ===================================== */

async function descobrirUltimaImagem() {

  let numero = 1;

  while (await imagemExiste(numero)) {
    numero++;
  }

  return numero - 1;

}




/* ===================================== */
/* FADE */
/* ===================================== */

function opacidadeFade(valor) {


  fade.setAttribute(

    "material",

    "shader: flat;" +
    "transparent: true;" +
    "opacity: " +
    valor

  );

}



/* ===================================== */
/* IR PARA PRETO */
/* ===================================== */

function fecharFade(callback) {


  let valor = 0;


  const animacao =
    setInterval(function () {


      valor += 0.08;


      if (valor >= 1) {


        valor = 1;


        opacidadeFade(
          valor
        );


        clearInterval(
          animacao
        );


        callback();


        return;

      }


      opacidadeFade(
        valor
      );


    }, 25);

}



/* ===================================== */
/* SAIR DO PRETO */
/* ===================================== */

function abrirFade() {


  let valor = 1;


  const animacao =
    setInterval(function () {


      valor -= 0.08;


      if (valor <= 0) {


        valor = 0;


        opacidadeFade(
          valor
        );


        clearInterval(
          animacao
        );


        trocando = false;


        return;

      }


      opacidadeFade(
        valor
      );


    }, 25);

}



/* ===================================== */
/* TROCAR PANORAMA */
/* ===================================== */

function carregarImagem(numero) {


  if (trocando) {

    return;

  }


  if (numero < 1) {

    return;

  }


  const endereco =
    enderecoImagem(numero);


  const teste =
    new Image();



  teste.onload =
    function () {


      trocando = true;


      fecharFade(

        function () {


          panorama.setAttribute(
            "src",
            endereco
          );


          imagemAtual =
            numero;



          setTimeout(

            function () {


              abrirFade();


            },

            300

          );


        }

      );


    };



  /*
  SE A PRÓXIMA IMAGEM
  NÃO EXISTIR,
  NÃO TROCA.
  */


  teste.onerror =
    function () {


      console.log(
        "Imagem não encontrada:",
        endereco
      );


    };


  teste.src =
    endereco;

}



/* ===================================== */
/* PRÓXIMA - NAVEGAÇÃO INFINITA */
/* ===================================== */

proxima.addEventListener(

  "click",

  async function () {

    if (trocando) {
      return;
    }

    const proximoNumero =
      imagemAtual + 1;

    const existe =
      await imagemExiste(proximoNumero);

    if (existe) {

      carregarImagem(
        proximoNumero
      );

    } else {

      carregarImagem(1);

    }

  }

);



/* ===================================== */
/* ANTERIOR - NAVEGAÇÃO INFINITA */
/* ===================================== */
/* ===================================== */

anterior.addEventListener(

  "click",

  async function () {

    if (trocando) {
      return;
    }

    if (imagemAtual > 1) {

      carregarImagem(
        imagemAtual - 1
      );

    } else {

      const ultimaImagem =
        await descobrirUltimaImagem();

      carregarImagem(
        ultimaImagem
      );

    }

  }

);



/* ===================================== */
/* ENTRAR */
/* ===================================== */

entrar.addEventListener(

  "click",

  function () {


    entrada.style.display =
      "none";


    /*
    O CLIQUE DO USUÁRIO
    LIBERA O ÁUDIO NO NAVEGADOR
    */


    musica.volume =
      0.45;


    musica.play()
      .catch(function (erro) {

        console.log(
          "Áudio aguardando autorização:",
          erro
        );

      });


  }

);


</script>


</body>

</html>
