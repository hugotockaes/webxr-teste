<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Galeria 360</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>


  <!-- ================================= -->
  <!-- COMPONENTE: RETÂNGULO ARREDONDADO -->
  <!-- ================================= -->

  <script>

    AFRAME.registerComponent("rounded-panel", {

      schema: {

        width: {
          type: "number",
          default: 1
        },

        height: {
          type: "number",
          default: 0.5
        },

        radius: {
          type: "number",
          default: 0.08
        },

        color: {
          type: "color",
          default: "#555555"
        },

        opacity: {
          type: "number",
          default: 1
        }

      },


      init: function () {

        const data = this.data;

        const w = data.width;
        const h = data.height;
        const r = Math.min(
          data.radius,
          w / 2,
          h / 2
        );


        const shape = new THREE.Shape();


        shape.moveTo(
          -w / 2 + r,
          -h / 2
        );


        shape.lineTo(
          w / 2 - r,
          -h / 2
        );


        shape.quadraticCurveTo(
          w / 2,
          -h / 2,
          w / 2,
          -h / 2 + r
        );


        shape.lineTo(
          w / 2,
          h / 2 - r
        );


        shape.quadraticCurveTo(
          w / 2,
          h / 2,
          w / 2 - r,
          h / 2
        );


        shape.lineTo(
          -w / 2 + r,
          h / 2
        );


        shape.quadraticCurveTo(
          -w / 2,
          h / 2,
          -w / 2,
          h / 2 - r
        );


        shape.lineTo(
          -w / 2,
          -h / 2 + r
        );


        shape.quadraticCurveTo(
          -w / 2,
          -h / 2,
          -w / 2 + r,
          -h / 2
        );


        const geometry =
          new THREE.ShapeGeometry(shape);


        const material =
          new THREE.MeshBasicMaterial({

            color:
              new THREE.Color(data.color),

            transparent:
              data.opacity < 1,

            opacity:
              data.opacity,

            side:
              THREE.DoubleSide

          });


        const mesh =
          new THREE.Mesh(
            geometry,
            material
          );


        this.el.setObject3D(
          "mesh",
          mesh
        );

      }

    });

  </script>



  <style>

    body {

      margin: 0;

      background: black;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }



    /* ================================= */
    /* TELA DE ENTRADA */
    /* ================================= */

    #entrada {

      position: fixed;

      inset: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      background: black;

      color: white;

      z-index: 20;

    }



    #entrada h1 {

      font-size: 34px;

      margin-bottom: 10px;

    }



    #entrada p {

      color: #999;

      margin-bottom: 30px;

    }



    #entrar {

      padding: 16px 32px;

      border: none;

      border-radius: 10px;

      background: #ddd;

      color: #111;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }

  </style>

</head>



<body>


<!-- ================================= -->
<!-- ENTRADA -->
<!-- ================================= -->

<div id="entrada">

  <h1>
    Experiência WebXR
  </h1>

  <p>
    Entre para explorar
  </p>

  <button id="entrar">
    ENTRAR
  </button>

</div>



<!-- ================================= -->
<!-- CENA -->
<!-- ================================= -->

<a-scene

  background="color: #000000"

  cursor="rayOrigin: mouse"

  raycaster="objects: .clicavel"

>


  <!-- ================================= -->
  <!-- PANORAMA -->
  <!-- IMAGEM 1 JÁ COMEÇA CARREGANDO -->
  <!-- ================================= -->

  <a-sky

    id="panorama"

    src="imagens/imagem360_1.jpg"

    rotation="0 -90 0">

  </a-sky>



  <!-- ================================= -->
  <!-- MENU PEQUENO -->
  <!-- ================================= -->

  <a-entity

    id="menu"

    position="0 1.18 -1.6"

  >


    <!-- CAIXA TRANSPARENTE -->

    <a-entity

      position="0 0 0"

      rounded-panel="
        width: 1.35;
        height: 0.52;
        radius: 0.08;
        color: #333333;
        opacity: 0.65">

    </a-entity>



    <!-- TEXTO -->

    <a-entity

      position="0 0.14 0.015"

      rounded-panel="
        width: 1.08;
        height: 0.15;
        radius: 0.04;
        color: #555555;
        opacity: 0.65">

    </a-entity>


    <a-text

      value="GALERIA 360"

      align="center"

      color="#FFFFFF"

      width="0.9"

      position="0 0.14 0.025">

    </a-text>



    <!-- ================================= -->
    <!-- ANTERIOR -->
    <!-- ================================= -->

    <a-entity

      id="anterior"

      class="clicavel"

      position="-0.29 -0.10 0.02"

      rounded-panel="
        width: 0.48;
        height: 0.19;
        radius: 0.045;
        color: #777777;
        opacity: 0.9"

      animation__mouseenter="
        property: scale;
        startEvents: mouseenter;
        dur: 150;
        to: 1.1 1.1 1.1"

      animation__mouseleave="
        property: scale;
        startEvents: mouseleave;
        dur: 150;
        to: 1 1 1"

    >


      <a-text

        value="< ANTERIOR"

        align="center"

        color="#FFFFFF"

        width="0.42"

        position="0 0 0.02">

      </a-text>


    </a-entity>



    <!-- ================================= -->
    <!-- PRÓXIMA -->
    <!-- ================================= -->

    <a-entity

      id="proxima"

      class="clicavel"

      position="0.29 -0.10 0.02"

      rounded-panel="
        width: 0.48;
        height: 0.19;
        radius: 0.045;
        color: #777777;
        opacity: 0.9"

      animation__mouseenter="
        property: scale;
        startEvents: mouseenter;
        dur: 150;
        to: 1.1 1.1 1.1"

      animation__mouseleave="
        property: scale;
        startEvents: mouseleave;
        dur: 150;
        to: 1 1 1"

    >


      <a-text

        value="PROXIMA >"

        align="center"

        color="#FFFFFF"

        width="0.42"

        position="0 0 0.02">

      </a-text>


    </a-entity>


  </a-entity>



  <!-- ================================= -->
  <!-- CÂMERA -->
  <!-- ================================= -->

  <a-camera>


    <!-- SELEÇÃO PELO OLHAR -->

    <a-cursor

      fuse="true"

      fuse-timeout="2000"

      color="#FFFFFF"

      raycaster="
        objects: .clicavel"


      animation__fusing="
        property: scale;
        startEvents: fusing;
        easing: easeInCubic;
        dur: 2000;
        from: 1 1 1;
        to: 0.2 0.2 0.2"


      animation__mouseleave="
        property: scale;
        startEvents: mouseleave;
        dur: 150;
        to: 1 1 1"

    >

    </a-cursor>



    <!-- ================================= -->
    <!-- FADE PRETO -->
    <!-- ================================= -->

    <a-plane

      id="fade"

      position="0 0 -0.35"

      width="4"

      height="4"

      color="#000000"

      material="
        shader: flat;
        transparent: true;
        opacity: 0">

    </a-plane>


  </a-camera>


</a-scene>



<script>


/* ================================= */
/* ELEMENTOS */
/* ================================= */

const entrada =
  document.querySelector("#entrada");


const entrar =
  document.querySelector("#entrar");


const panorama =
  document.querySelector("#panorama");


const proxima =
  document.querySelector("#proxima");


const anterior =
  document.querySelector("#anterior");


const fade =
  document.querySelector("#fade");



/* ================================= */
/* IMAGEM ATUAL */
/* ================================= */

let imagemAtual = 1;

let trocando = false;



/* ================================= */
/* CRIA O ENDEREÇO AUTOMATICAMENTE */
/* ================================= */

function enderecoImagem(numero) {

  return (
    "imagens/imagem360_" +
    numero +
    ".jpg"
  );

}



/* ================================= */
/* OPACIDADE DO FADE */
/* ================================= */

function definirFade(valor) {

  fade.setAttribute(

    "material",

    "shader: flat;" +
    "transparent: true;" +
    "opacity: " + valor

  );

}



/* ================================= */
/* FECHA A IMAGEM EM PRETO */
/* ================================= */

function fadeParaPreto(callback) {

  let opacity = 0;


  const timer =
    setInterval(function () {


      opacity += 0.07;


      if (opacity >= 1) {

        opacity = 1;

        definirFade(opacity);

        clearInterval(timer);

        callback();

        return;

      }


      definirFade(opacity);


    }, 25);

}



/* ================================= */
/* REVELA NOVA IMAGEM */
/* ================================= */

function fadeDaImagem() {

  let opacity = 1;


  const timer =
    setInterval(function () {


      opacity -= 0.07;


      if (opacity <= 0) {

        opacity = 0;

        definirFade(opacity);

        clearInterval(timer);

        trocando = false;

        return;

      }


      definirFade(opacity);


    }, 25);

}



/* ================================= */
/* TROCAR PANORAMA */
/* ================================= */

function carregarImagem(numero) {


  if (trocando) {

    return;

  }


  if (numero < 1) {

    return;

  }


  const endereco =
    enderecoImagem(numero);


  const teste =
    new Image();



  /* IMAGEM EXISTE */

  teste.onload =
    function () {


      trocando = true;


      fadeParaPreto(

        function () {


          panorama.setAttribute(
            "src",
            endereco
          );


          imagemAtual =
            numero;


          /*
          Aguarda um instante
          para a textura entrar
          */


          setTimeout(

            function () {

              fadeDaImagem();

            },

            300

          );


        }

      );


    };



  /* IMAGEM NÃO EXISTE */

  teste.onerror =
    function () {


      console.log(
        "Imagem não encontrada:",
        endereco
      );


    };



  teste.src =
    endereco;

}



/* ================================= */
/* PRÓXIMA */
/* ================================= */

proxima.addEventListener(

  "click",

  function () {


    carregarImagem(
      imagemAtual + 1
    );


  }

);



/* ================================= */
/* ANTERIOR */
/* ================================= */

anterior.addEventListener(

  "click",

  function () {


    carregarImagem(
      imagemAtual - 1
    );


  }

);



/* ================================= */
/* ENTRAR */
/* ================================= */

entrar.addEventListener(

  "click",

  function () {


    /*
    A IMAGEM 1 JÁ ESTÁ
    CARREGADA ATRÁS DA TELA
    */


    entrada.style.display =
      "none";


  }

);


</script>


</body>

</html>
