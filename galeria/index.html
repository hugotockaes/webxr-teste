<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Configurador de Exposição WebXR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background:#111; }
    #ui {
      position: fixed; z-index: 10; top: 18px; left: 18px; width: 390px;
      max-height: calc(100vh - 36px); overflow-y:auto;
      padding: 22px 22px 16px; border-radius: 16px; color: #fff;
      background: rgba(15,15,18,.90); box-shadow: 0 12px 35px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }
    #ui h1 { margin:0 0 5px; font-size:20px; }
    #ui p { margin:0 0 15px; font-size:12px; color:#aaa; line-height:1.4; }
    label { display:block; margin:12px 0 5px; font-size:12px; font-weight:700; }
    input, select {
      width:100%; border:1px solid #3c3c42; border-radius:9px; padding:10px 11px;
      background:#222228; color:white; font-size:14px; outline:none;
    }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }
    button { border:0; border-radius:9px; padding:11px 8px; font-weight:800; cursor:pointer; }
    #create { background:#f2c230; color:#111; }
    #clear { background:#33333a; color:#fff; }
    #enter { display:none; width:100%; margin-top:8px; background:#fff; color:#111; }
    #preloader, #standardSize { width:100%; margin-top:8px; background:#59606b; color:#fff; }
    #status { margin-top:11px; min-height:16px; font-size:11px; color:#ddd; line-height:1.4; }
    #credit { margin-top:18px; padding-top:12px; border-top:1px solid #34343a; color:#85858d; font-size:10px; text-align:center; }
    @media (max-width: 600px) {
      #ui { top:10px; left:10px; width:calc(100% - 20px); max-height:calc(100vh - 20px); }
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>CONFIGURADOR DE EXPOSIÇÃO</h1>
    <p>Protótipo WebXR · geração automática de expositores · imagens carregadas da pasta <strong>galeria</strong></p>

    <label for="columns">Colunas</label>
    <input id="columns" type="number" min="1" max="20" value="2" />

    <label for="spacing">Espaçamento lateral (m)</label>
    <input id="spacing" type="number" min="0" max="20" step="0.1" value="1" />

    <label for="columnSpacing">Espaçamento entre colunas (m)</label>
    <input id="columnSpacing" type="number" min="0" max="50" step="0.1" value="3" />

    <label for="quantity">Quantidade de expositores</label>
    <input id="quantity" type="number" min="1" max="200" value="6" />

    <label for="panelWidth">Largura do expositor (m)</label>
    <input id="panelWidth" type="number" min="0.2" max="10" step="0.05" value="1.20" />

    <label for="panelHeight">Altura do expositor (m)</label>
    <input id="panelHeight" type="number" min="0.2" max="10" step="0.05" value="1.80" />

    <button id="standardSize">DIMENSÃO PADRÃO EXPOSITOR — 1,20 × 1,80 m</button>

    <label for="panelSide">Tipo de expositor</label>
    <select id="panelSide">
      <option value="front" selected>Frente</option>
      <option value="double">Frente e verso</option>
    </select>

    <label for="xrMode">Modo de visualização</label>
    <select id="xrMode">
      <option value="vr" selected>Realidade Virtual</option>
      <option value="mr">Realidade Mista</option>
    </select>

    <div class="buttons">
      <button id="create">CRIAR</button>
      <button id="clear">LIMPAR</button>
    </div>
    <button id="preloader">PRE-LOADER</button>
    <button id="enter">ENTRAR NA EXPOSIÇÃO</button>
    <div id="status">Pronto para criar.</div>
    <div id="credit">Desenvolvido por Hugo Duarte Tockaes.</div>
  </div>

  <a-scene background="color: #D9D9D9" renderer="colorManagement: true; antialias: true; alpha: true" webxr="optionalFeatures: local-floor, bounded-floor, hit-test, hand-tracking" xr-mode-ui="XRMode: xr">
    <a-entity light="type: ambient; intensity: 1.1"></a-entity>
    <a-entity light="type: directional; intensity: 1.2" position="2 6 3"></a-entity>
    <a-plane id="virtualFloor" position="0 0 -6" rotation="-90 0 0" width="60" height="60" color="#B8B8B8"></a-plane>
    <a-sky id="virtualSky" color="#ECECEC"></a-sky>
    <a-entity id="exhibition-root"></a-entity>

    <!-- Hand tracking: pinch + segurar recentraliza a exposição ao redor do visitante. -->

    <!-- Loader visual do gesto. É reposicionado próximo à mão que iniciou o pinch. -->
    <a-entity id="pinchLoader" visible="false">
      <a-ring radius-inner="0.035" radius-outer="0.045" color="#FFFFFF" material="shader: flat; opacity: 0.28; transparent: true"></a-ring>
      <a-torus id="pinchLoaderArc" radius="0.040" radius-tubular="0.006" arc="85" color="#F2C230" material="shader: flat" rotation="0 0 0"></a-torus>
    </a-entity>

    <a-entity id="rig" position="0 0 4">
      <a-camera id="viewerCamera" position="0 1.70 0" look-controls wasd-controls="acceleration: 25"></a-camera>
      <a-entity id="leftHand" hand-tracking-controls="hand: left; modelColor: #ffffff"></a-entity>
      <a-entity id="rightHand" hand-tracking-controls="hand: right; modelColor: #ffffff"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const root = document.querySelector('#exhibition-root');
    const status = document.querySelector('#status');
    const columnsInput = document.querySelector('#columns');
    const spacingInput = document.querySelector('#spacing');
    const columnSpacingInput = document.querySelector('#columnSpacing');
    const quantityInput = document.querySelector('#quantity');
    const panelWidthInput = document.querySelector('#panelWidth');
    const panelHeightInput = document.querySelector('#panelHeight');
    const panelSideInput = document.querySelector('#panelSide');
    const xrModeInput = document.querySelector('#xrMode');
    const virtualFloor = document.querySelector('#virtualFloor');
    const virtualSky = document.querySelector('#virtualSky');
    const enterButton = document.querySelector('#enter');
    const preloaderButton = document.querySelector('#preloader');
    const standardSizeButton = document.querySelector('#standardSize');
    const scene = document.querySelector('a-scene');
    const viewerCamera = document.querySelector('#viewerCamera');
    const leftHand = document.querySelector('#leftHand');
    const rightHand = document.querySelector('#rightHand');
    const pinchLoader = document.querySelector('#pinchLoader');
    const pinchLoaderArc = document.querySelector('#pinchLoaderArc');
    let galleryImages = [];
    let pinchTimer = null;
    let pinchAnimation = null;
    let activePinchHand = null;
    const PINCH_HOLD_MS = 1500;

    function clearExhibition(clearFields = false) {
      while (root.firstChild) root.removeChild(root.firstChild);
      root.object3D.position.set(0, 0, 0);
      root.object3D.rotation.set(0, 0, 0);
      cancelPinchHold();
      enterButton.style.display = 'none';
      galleryImages = [];
      if (clearFields) {
        columnsInput.value = '';
        spacingInput.value = '';
        columnSpacingInput.value = '';
        quantityInput.value = '';
        panelWidthInput.value = '';
        panelHeightInput.value = '';
        panelSideInput.value = 'front';
        status.textContent = 'Campos e exposição limpos.';
      } else status.textContent = 'Exposição limpa.';
    }

    function imageExists(url) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(url);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    async function findSequentialImage(n) {
      // Aceita PNG, JPG, JPEG e WEBP. A busca termina quando nenhum formato existir para o próximo número.
      const extensions = ['png', 'jpg', 'jpeg', 'webp'];
      for (const ext of extensions) {
        const found = await imageExists(`galeria/${n}.${ext}`);
        if (found) return found.split('?')[0];
      }
      return null;
    }

    async function loadGallery() {
      const found = [];
      let n = 1;
      while (n <= 500) {
        const url = await findSequentialImage(n);
        if (!url) break;
        found.push(url);
        n++;
      }
      return found;
    }

    function addImageFace(exhibitor, url, centerY, panelWidth, panelHeight, frameDepth, side) {
      const image = document.createElement('a-image');
      const isBack = side === 'back';
      image.setAttribute('class', isBack ? 'gallery-image face-back' : 'gallery-image face-front');
      image.setAttribute('data-face', side);
      image.setAttribute('src', url);
      image.setAttribute('width', panelWidth);
      image.setAttribute('height', panelHeight);
      image.setAttribute('position', `0 ${centerY} ${isBack ? -(frameDepth / 2 + 0.012) : (frameDepth / 2 + 0.012)}`);
      if (isBack) image.setAttribute('rotation', '0 180 0');
      image.setAttribute('material', 'shader: flat; side: double');
      exhibitor.appendChild(image);
    }

    async function createExhibition() {
      const columns = Math.max(1, parseInt(columnsInput.value, 10) || 1);
      const spacing = Math.max(0, parseFloat(spacingInput.value) || 0);
      const columnSpacing = Math.max(0, parseFloat(columnSpacingInput.value) || 0);
      const requestedQuantity = Math.max(1, parseInt(quantityInput.value, 10) || 1);
      const panelWidth = Math.max(0.2, parseFloat(panelWidthInput.value) || 1.20);
      const panelHeight = Math.max(0.2, parseFloat(panelHeightInput.value) || 1.80);
      const panelSide = panelSideInput.value;

      clearExhibition(false);
      status.textContent = 'Procurando imagens sequenciais na pasta galeria...';
      galleryImages = await loadGallery();

      const facesPerExhibitor = panelSide === 'double' ? 2 : 1;
      // Se houver imagens, a galeria define automaticamente quantos expositores são necessários.
      // Se não houver, preservamos o valor manual para permitir testar o espaço vazio.
      const quantity = galleryImages.length
        ? Math.ceil(galleryImages.length / facesPerExhibitor)
        : requestedQuantity;
      quantityInput.value = quantity;

      const frameWidth = panelWidth + 0.06;
      const frameHeight = panelHeight + 0.06;
      const frameDepth = 0.05;
      const centerY = frameHeight / 2 + 0.12;
      const stepX = panelWidth + spacing;
      const stepZ = frameDepth + columnSpacing;
      const totalWidth = (columns - 1) * stepX;
      // A câmera começa em Z=4 olhando para -Z. A primeira fileira nasce próxima do visitante.
      const firstRowZ = 1.5;

      for (let i = 0; i < quantity; i++) {
        const col = i % columns;
        const row = Math.floor(i / columns);
        const x = col * stepX - totalWidth / 2;
        const z = firstRowZ - row * stepZ;
        const exhibitor = document.createElement('a-entity');
        exhibitor.setAttribute('id', `expositor-${String(i + 1).padStart(2, '0')}`);
        exhibitor.setAttribute('position', `${x} 0 ${z}`);

        const frame = document.createElement('a-box');
        frame.setAttribute('position', `0 ${centerY} 0`);
        frame.setAttribute('width', frameWidth);
        frame.setAttribute('height', frameHeight);
        frame.setAttribute('depth', frameDepth);
        frame.setAttribute('color', '#292929');

        const frontPanel = document.createElement('a-box');
        frontPanel.setAttribute('position', `0 ${centerY} ${frameDepth / 2 + 0.006}`);
        frontPanel.setAttribute('width', panelWidth);
        frontPanel.setAttribute('height', panelHeight);
        frontPanel.setAttribute('depth', '0.01');
        frontPanel.setAttribute('color', '#F7F2E8');

        const base = document.createElement('a-box');
        base.setAttribute('position', '0 0.075 0');
        base.setAttribute('width', '0.55');
        base.setAttribute('height', '0.15');
        base.setAttribute('depth', '0.55');
        base.setAttribute('color', '#292929');

        exhibitor.appendChild(frame);
        exhibitor.appendChild(frontPanel);

        const frontImageIndex = panelSide === 'double' ? i * 2 : i;
        if (galleryImages[frontImageIndex]) addImageFace(exhibitor, galleryImages[frontImageIndex], centerY, panelWidth, panelHeight, frameDepth, 'front');

        if (panelSide === 'double') {
          const backPanel = document.createElement('a-box');
          backPanel.setAttribute('position', `0 ${centerY} ${-(frameDepth / 2 + 0.006)}`);
          backPanel.setAttribute('rotation', '0 180 0');
          backPanel.setAttribute('width', panelWidth);
          backPanel.setAttribute('height', panelHeight);
          backPanel.setAttribute('depth', '0.01');
          backPanel.setAttribute('color', '#F7F2E8');
          exhibitor.appendChild(backPanel);
          if (galleryImages[i * 2 + 1]) addImageFace(exhibitor, galleryImages[i * 2 + 1], centerY, panelWidth, panelHeight, frameDepth, 'back');
        }

        exhibitor.appendChild(base);
        root.appendChild(exhibitor);
      }

      const modeLabel = xrModeInput.value === 'mr' ? 'Realidade Mista' : 'Realidade Virtual';
      const sideLabel = panelSide === 'double' ? 'Frente e verso' : 'Frente';
      const galleryLabel = galleryImages.length ? `${galleryImages.length} imagens encontradas automaticamente` : 'nenhuma imagem encontrada em galeria/';
      status.textContent = `${quantity} expositores · ${galleryLabel} · ${panelWidth.toFixed(2)} × ${panelHeight.toFixed(2)} m · ${sideLabel} · ${modeLabel}.`;
      enterButton.style.display = 'block';
    }

    async function preloadGallery() {
      preloaderButton.disabled = true;
      const originalText = 'PRE-LOADER';
      galleryImages = [];
      let n = 1;
      while (n <= 500) {
        preloaderButton.textContent = `CARREGANDO ${n}...`;
        const url = await findSequentialImage(n);
        if (!url) break;
        // Mantém a imagem decodificada/cacheada antes da entrada na exposição.
        await new Promise(resolve => {
          const img = new Image();
          img.onload = async () => {
            try { if (img.decode) await img.decode(); } catch (_) {}
            resolve();
          };
          img.onerror = resolve;
          img.src = url;
        });
        galleryImages.push(url);
        n++;
      }
      preloaderButton.textContent = galleryImages.length
        ? `PRE-LOAD CONCLUÍDO — ${galleryImages.length} IMAGENS`
        : 'PRE-LOADER — NENHUMA IMAGEM';
      status.textContent = galleryImages.length
        ? `${galleryImages.length} imagens pré-carregadas da pasta galeria.`
        : 'Nenhuma imagem sequencial encontrada na pasta galeria.';
      preloaderButton.disabled = false;
      setTimeout(() => { preloaderButton.textContent = originalText; }, 3500);
    }



    function getExhibitionCenterWorldLocal() {
      const exhibitors = [...root.children].filter(el => el.id && el.id.startsWith('expositor-'));
      if (!exhibitors.length) return null;
      let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
      exhibitors.forEach(el => {
        const p = el.object3D.position;
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
      });
      return { x: (minX + maxX) / 2, z: (minZ + maxZ) / 2 };
    }

    function recenterExhibition() {
      const center = getExhibitionCenterWorldLocal();
      if (!center || !viewerCamera.object3D) return;

      const headWorld = new THREE.Vector3();
      viewerCamera.object3D.getWorldPosition(headWorld);

      // Em WebXR não movemos o tracking origin do Quest. Movemos a exposição inteira
      // para que o centro geométrico dela coincida com a posição atual do visitante.
      root.object3D.position.x = headWorld.x - center.x;
      root.object3D.position.z = headWorld.z - center.z;
      root.object3D.position.y = 0;
      root.object3D.updateMatrixWorld(true);

      status.textContent = 'Exposição recentralizada na sua posição atual.';
    }

    function placeLoaderAtHand(hand) {
      const world = new THREE.Vector3();
      hand.object3D.getWorldPosition(world);
      pinchLoader.object3D.position.copy(world);
      pinchLoader.object3D.position.y += 0.10;

      // Faz o indicador olhar para a câmera.
      const cam = new THREE.Vector3();
      viewerCamera.object3D.getWorldPosition(cam);
      pinchLoader.object3D.lookAt(cam);
    }

    function cancelPinchHold() {
      if (pinchTimer) clearTimeout(pinchTimer);
      pinchTimer = null;
      activePinchHand = null;
      pinchLoader.setAttribute('visible', false);
      if (pinchAnimation) cancelAnimationFrame(pinchAnimation);
      pinchAnimation = null;
      pinchLoaderArc.object3D.rotation.z = 0;
    }

    function startPinchHold(hand) {
      cancelPinchHold();
      if (!root.children.length) return;
      activePinchHand = hand;
      pinchLoader.setAttribute('visible', true);
      const start = performance.now();

      const animateLoader = (now) => {
        if (!activePinchHand) return;
        placeLoaderAtHand(activePinchHand);
        const progress = Math.min(1, (now - start) / PINCH_HOLD_MS);
        // Arco gira e acelera visualmente até completar o hold.
        pinchLoaderArc.object3D.rotation.z = -progress * Math.PI * 2;
        const scale = 0.85 + progress * 0.30;
        pinchLoader.object3D.scale.set(scale, scale, scale);
        pinchAnimation = requestAnimationFrame(animateLoader);
      };
      pinchAnimation = requestAnimationFrame(animateLoader);

      pinchTimer = setTimeout(() => {
        recenterExhibition();
        cancelPinchHold();
      }, PINCH_HOLD_MS);
    }

    [leftHand, rightHand].forEach(hand => {
      hand.addEventListener('pinchstarted', () => startPinchHold(hand));
      hand.addEventListener('pinchended', cancelPinchHold);
    });

    standardSizeButton.addEventListener('click', () => {
      panelWidthInput.value = '1.20';
      panelHeightInput.value = '1.80';
      status.textContent = 'Dimensão padrão aplicada: 1,20 × 1,80 m.';
    });
    preloaderButton.addEventListener('click', preloadGallery);

    document.querySelector('#create').addEventListener('click', createExhibition);
    document.querySelector('#clear').addEventListener('click', () => clearExhibition(true));
    enterButton.addEventListener('click', async () => {
      document.querySelector('#ui').style.display = 'none';
      const mixedReality = xrModeInput.value === 'mr';
      virtualSky.setAttribute('visible', !mixedReality);
      virtualFloor.setAttribute('visible', !mixedReality);
      scene.setAttribute('background', mixedReality ? 'transparent: true' : 'color: #D9D9D9');
      try {
        if (mixedReality && scene.enterAR) await scene.enterAR();
        else if (scene.enterVR) await scene.enterVR();
      } catch (e) {
        document.querySelector('#ui').style.display = 'block';
        status.textContent = mixedReality ? 'O navegador/dispositivo não iniciou a sessão de Realidade Mista.' : 'O navegador/dispositivo não iniciou a sessão de Realidade Virtual.';
      }
    });
    scene.addEventListener('exit-vr', () => document.querySelector('#ui').style.display = 'block');
  </script>
</body>
</html>
