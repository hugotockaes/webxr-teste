<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Teste MR — Menu de Cores</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js">
// As imagens m2..m6 também são alvos do olhar.
// Ao mirar, elas dão um pequeno zoom; ao completar 2s, acionam a cor correspondente.
const thumbColors = ['#FF7A00','#E52323','#22B14C','#1677FF','#7A35C8'];
document.querySelectorAll('.thumb').forEach((thumb, i) => {
  thumb.addEventListener('click', () => {
    const alvo = [...document.querySelectorAll('.cor-btn')]
      .find(b => b.dataset.cor === thumbColors[i]);
    if (alvo) alvo.click();
  });
});

</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
</style>
</head>
<body>

<a-scene
  webxr="requiredFeatures: local-floor; optionalFeatures: bounded-floor; referenceSpaceType: local-floor;"
  xr-mode-ui="enabled:true; XRMode:ar;"
  renderer="antialias:true; alpha:true; colorManagement:true;"
  background="transparent:true">

  <!-- Esfera que simula o futuro fundo 360 -->
  <a-assets>
  <img id="menuImg" src="./menu.png" crossorigin="anonymous">
  <img id="m2" src="./m2.png" crossorigin="anonymous">
  <img id="m3" src="./m3.png" crossorigin="anonymous">
  <img id="m4" src="./m4.png" crossorigin="anonymous">
  <img id="m5" src="./m5.png" crossorigin="anonymous">
  <img id="m6" src="./m6.png" crossorigin="anonymous">
</a-assets>

<a-sky id="fundo" color="#000000" visible="false"></a-sky>


  <!-- MENU FIXO NO AMBIENTE: não acompanha a cabeça -->
  <!-- Aproximadamente 50% menor que a versão anterior -->
  <a-entity id="menuFixo" position="0 1.55 -2.00" scale="0.5 0.5 0.5">

    <!-- arte de fundo -->
    <a-plane
      src="#menuImg"
      width="1.60"
      height="0.90"
      position="0 0 -0.02"
      material="shader: flat; transparent: true">
    </a-plane>


    <!-- IMAGENS DOS BOTÕES: m1 fica vazio nesta etapa -->
    <a-plane class="thumb" src="#m2" width=".39" height=".34"
      position="0 .20 0.006"
      material="shader:flat; transparent:true"
      animation__hover="property:scale; startEvents:mouseenter; to:1.08 1.08 1.08; dur:160; easing:easeOutQuad"
      animation__leave="property:scale; startEvents:mouseleave; to:1 1 1; dur:160; easing:easeOutQuad">
    </a-plane>

    <a-plane class="thumb" src="#m3" width=".39" height=".34"
      position=".42 .20 0.006"
      material="shader:flat; transparent:true"
      animation__hover="property:scale; startEvents:mouseenter; to:1.08 1.08 1.08; dur:160; easing:easeOutQuad"
      animation__leave="property:scale; startEvents:mouseleave; to:1 1 1; dur:160; easing:easeOutQuad">
    </a-plane>

    <a-plane class="thumb" src="#m4" width=".39" height=".34"
      position="-.42 -.20 0.006"
      material="shader:flat; transparent:true"
      animation__hover="property:scale; startEvents:mouseenter; to:1.08 1.08 1.08; dur:160; easing:easeOutQuad"
      animation__leave="property:scale; startEvents:mouseleave; to:1 1 1; dur:160; easing:easeOutQuad">
    </a-plane>

    <a-plane class="thumb" src="#m5" width=".39" height=".34"
      position="0 -.20 0.006"
      material="shader:flat; transparent:true"
      animation__hover="property:scale; startEvents:mouseenter; to:1.08 1.08 1.08; dur:160; easing:easeOutQuad"
      animation__leave="property:scale; startEvents:mouseleave; to:1 1 1; dur:160; easing:easeOutQuad">
    </a-plane>

    <a-plane class="thumb" src="#m6" width=".39" height=".34"
      position=".42 -.20 0.006"
      material="shader:flat; transparent:true"
      animation__hover="property:scale; startEvents:mouseenter; to:1.08 1.08 1.08; dur:160; easing:easeOutQuad"
      animation__leave="property:scale; startEvents:mouseleave; to:1 1 1; dur:160; easing:easeOutQuad">
    </a-plane>

    <!-- ÁREAS INTERATIVAS SOBRE OS 6 ESPAÇOS DO menu.png -->
    <!-- Linha superior -->
    <a-plane class="cor-btn" width=".39" height=".34"
      position="-.42 .20 0" material="color:#FFD600; transparent:true; opacity:0.001"
      data-cor="#FFD600"></a-plane>

    <a-plane class="cor-btn" width=".39" height=".34"
      position="0 .20 0" material="color:#FF7A00; transparent:true; opacity:0.001"
      data-cor="#FF7A00"></a-plane>

    <a-plane class="cor-btn" width=".39" height=".34"
      position=".42 .20 0" material="color:#E52323; transparent:true; opacity:0.001"
      data-cor="#E52323"></a-plane>

    <!-- Linha inferior -->
    <a-plane class="cor-btn" width=".39" height=".34"
      position="-.42 -.20 0" material="color:#22B14C; transparent:true; opacity:0.001"
      data-cor="#22B14C"></a-plane>

    <a-plane class="cor-btn" width=".39" height=".34"
      position="0 -.20 0" material="color:#1677FF; transparent:true; opacity:0.001"
      data-cor="#1677FF"></a-plane>

    <a-plane class="cor-btn" width=".39" height=".34"
      position=".42 -.20 0" material="color:#7A35C8; transparent:true; opacity:0.001"
      data-cor="#7A35C8"></a-plane>

  </a-entity>

  <a-camera position="0 1.6 0" wasd-controls-enabled="false">

    <!-- cursor por olhar: 2 segundos sobre o botão = clique; não usa controle -->
    <a-entity
      cursor="rayOrigin:entity; fuse:true; fuseTimeout:2000"
      raycaster="objects:.cor-btn, .thumb; far:8"
      position="0 0 -0.8"
      geometry="primitive:ring; radiusInner:.004; radiusOuter:.007"
      material="color:white; shader:flat"
      animation__fusing="property:scale; startEvents:fusing; from:1 1 1; to:.25 .25 .25; dur:2000"
      animation__reset="property:scale; startEvents:mouseleave; to:1 1 1; dur:120"
      animation__click="property:scale; startEvents:click; to:1 1 1; dur:120">
    </a-entity>

 </a-camera>
</a-scene>

<script>
const fundo = document.getElementById('fundo');
const botoes = document.querySelectorAll('.cor-btn');
let primeiraTroca = true;

botoes.forEach(botao => {

  botao.addEventListener('click', () => {
    const cor = botao.dataset.cor;

    if (primeiraTroca) {
      fundo.setAttribute('color', cor);
      fundo.setAttribute('visible', true);
      primeiraTroca = false;
      return;
    }

    // pequena transição: escurece e entra a nova cor
    fundo.setAttribute(
      'animation__out',
      'property:material.opacity; from:1; to:0; dur:250'
    );

    setTimeout(() => {
      fundo.setAttribute('color', cor);
      fundo.setAttribute('material', 'opacity:0');

      fundo.setAttribute(
        'animation__in',
        'property:material.opacity; from:0; to:1; dur:500'
      );
    }, 260);
  });
});
</script>

</body>
</html>
